  return { X, avatarNadia, coachs, logoBanque, entete, mention, calculatrice, taperCalcul, balance, classeur, punaise, postit, etiquette, etagere, objet, vitrineEQ, inserer, poser, premiereFois, son, creditsImages,
    film, etapes, couperFilms, cascade, confettis, xpSaute, vivant };
})();
// ═══ KIT COMPTA EQ v1 — fin ═══
</script>
<script id="decor-m3-js">
// ═══ DÉCOR MISSION 3 — début (affichage seulement : aucune logique, rien n'est enregistré ; voir outils/DECOR_REGLES.md) ═══
// Le décor s'ajoute APRÈS chaque affichage : render() et refreshLive() d'origine ne changent pas, on les complète.
// Chaque chiffre montré par le décor vient de la page : ses fonctions de lecture (SIM(), bilanData(), pvTTC()…) ou un texte déjà affiché.
const DECOR = (() => {
  const X = COMPTA.X;
  /** Écran affiché : même règle que render(), en lecture seule. */
  const ecran = () => MODE === "login" ? "login" : MODE === "ferme" ? "ferme" : MODE === "bloque" ? "bloque" : MODE === "ancien" ? "ancien" : MODE === "briefing" ? "briefing" : MODE === "consultation" ? "fin" : STEPS3[S.step].key;
  const q = (sel, racine) => (racine || document).querySelector(sel);
  const qa = (sel, racine) => Array.from((racine || document).querySelectorAll(sel));
  /** Insère une seule fois (repère data-decor) ; le HTML n'est fabriqué que s'il manque (decorer() suit chaque frappe). */
  const poser = (cible, position, cle, html) => {
    if (!cible) return null;
    const parent = position === "beforebegin" || position === "afterend" ? cible.parentElement : cible;
    const deja = parent && parent.querySelector(`[data-decor="${cle}"]`);
    return deja || COMPTA.inserer(cible, position, cle, typeof html === "function" ? html() : html);
  };
  const sonUneFois = (cle, nom) => { if (COMPTA.premiereFois(cle)) COMPTA.son(nom); };
  /** Lecture prudente d'une valeur de la page (rend « defaut » si elle n'existe pas encore). */
  const lire = (fn, defaut) => { try { const v = fn(); return v == null ? defaut : v; } catch(e) { return defaut; } };
  const entreprise = () => lire(() => V1(deno), "");
  const sansEuro = (t) => String(t).replace(/\s*€\s*$/, "");
  const texte = (el) => ((el && el.textContent) || "").replace(/\s+/g, " ").trim();
  const papier = (main, titre) => qa(".paper", main).find(p => texte(q(".ph h4", p)) === titre);
  /** V2 : typographie française. L'espace devant « : ; ! ? % € » » et après « « » devient insécable, pour qu'aucun de ces
   *  signes ne commence une ligne (sur téléphone surtout). Seules ces espaces changent, jamais les mots ni les chiffres. */
  function typo(racine){
    if (!racine) return;
    const w = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()){
      if (/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)) continue;
      const v = n.nodeValue.replace(/ ([:;!?%€»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
      if (v !== n.nodeValue) n.nodeValue = v;
    }
  }

  // ─── Briefing : la boutique de l'élève, et le calendrier des quatre semaines ───
  const SEMAINES = [["🎉", "Ouverture et premier devis", 0], ["📅", "Les échéances tombent", 0], ["🚚", "Livraison et facture de vente", 2], ["💶", "Promotion et encaissement", 4]];
  function briefing(main){
    const lead = q(".hero > p.lead", main); if (!lead) return;
    poser(lead, "afterend", "m3-ouverture", () => {
      const jours = ["L", "M", "M", "J", "V", "S", "D"];
      const grille = `<span></span>${jours.map(j => `<span class="m3-cal-j">${j}</span>`).join("")}`
        + SEMAINES.map((s, k) => `<span class="m3-cal-n">S${k + 1}</span>${jours.map((j, d) => `<span class="m3-cal-case${d === s[2] ? " m3-cal-evt" : d > 4 ? " m3-cal-we" : ""}">${d === s[2] ? s[0] : ""}</span>`).join("")}`).join("");
      return `<div class="m3-ouverture" aria-hidden="true">
        <div class="m3-ouv-vitrine kit-anim" data-anim="m3-ouv-vitrine">${lire(() => V1(() => COMPTA.vitrineEQ("m3brief")), "")}</div>
        <div class="kit-anim d2 cpt-cache-mobile" data-anim="m3-calendrier"><div class="m3-calendrier"><div class="m3-cal-anneaux"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="m3-cal-tete"><b>Mon premier mois</b><small>${X(entreprise())}</small></div>
          <div class="m3-cal-grille">${grille}</div>
          <ul class="m3-cal-legende">${SEMAINES.map((s, k) => `<li><b>S${k + 1}</b>${s[0]} ${X(s[1])}</li>`).join("")}</ul>
          <div class="m3-cal-fin">📊 Fin du mois : compte de résultats et bilan</div></div></div></div>`;
    });
  }

  // ─── Stock : la réserve (un carton par article, avec la quantité tapée) et le bon de commande au grossiste ───
  function stock(main){
    const f = lire(() => march().fournisseur, null), liste = lire(() => arts(), []); if (!f) return;
    poser(q(".fourn", main), "afterend", "m3-reserve", () => `<div class="m3-reserve kit-anim" data-anim="m3-reserve" aria-hidden="true"><span class="m3-reserve-plaque">Réserve</span>
      <div class="m3-reserve-rayon">${liste.map((a, i) => { const n = S.qtes[i];
        return `<div class="m3-carton ${n ? "cpt-carton" : "m3-carton-vide"}"><span class="m3-carton-scotch"></span><span class="m3-carton-emoji">${X(a.emoji)}</span><span class="m3-carton-etiq"><b>${n ? "× " + X(n) : "à commander"}</b><small>${X(a.nom)}</small></span></div>`; }).join("")}</div></div>`);
    qa(".art .ai", main).forEach(ai => ai.classList.add("cpt-carton", "m3-ai-carton"));
    const bon = qa(".card.tight", main).find(c => /commande/i.test(texte(q("h3", c))));
    if (!bon) return;
    bon.classList.add("m3-bon");
    poser(bon, "afterbegin", "m3-bon-tete", () => `<div class="m3-bon-tete" aria-hidden="true"><span><b>Bon de commande</b><small>${X(entreprise())}</small></span><span class="m3-bon-dest">à l'attention de<br><b>${X(f.nom + " " + f.forme)}</b></span></div>`);
    const signe = q('[data-decor="m3-bon-signe"]', bon), ok = lire(() => VALID3.stock(), false);
    if (ok && !signe) poser(bon, "beforeend", "m3-bon-signe", `<div class="m3-bon-signe" aria-hidden="true"><small>Bon pour commande</small><span class="signed">${X(String(S.eleve.prenom + " " + S.eleve.nom).trim())}</span>${COMPTA.mention()}</div>`);
    else if (!ok && signe) signe.remove();
  }

  // ─── Réception : le camion du grossiste et ses colis ; le bon de livraison signé reçoit le tampon « Reçu » ───
  function reception(main){
    const f = S.commande, fo = lire(() => march().fournisseur, null); if (!f || !fo) return;
    const papiers = qa(".grid .paper", main), bl = papiers[0];
    const route = poser(q(".coach", main), "afterend", "m3-livraison", () => {
      const nb = (texte(bl).match(/Colis\s*:\s*(\d+)/) || [])[1], dest = entreprise();      // le nombre de colis affiché sur le bon
      const colis = Array.from({ length:Math.max(1, Math.min(3, +nb || 1)) }, (_, k) => `<div class="m3-colis cpt-carton"><span class="m3-colis-scotch"></span>
        <span class="m3-colis-etiq"><b>À : ${X(dest)}</b>De : ${X(fo.nom)}${KIT.codeBarres(f.bl + "-" + k, 12)}<small>${X(f.bl)}${nb ? " · " + (k + 1) + "/" + X(nb) : ""}</small></span>${k === 0 ? `<span class="m3-colis-fragile">Fragile</span>` : ""}</div>`).join("");
      return `<div class="kit-route m3-livraison" data-anim="m3-livraison" aria-hidden="true"><div class="m3-facade cpt-cache-mobile"><span class="m3-facade-nom">${X(dest)}</span><span class="m3-facade-vitre"></span><span class="m3-facade-porte"></span></div>
        ${KIT.camion({ nom:fo.nom, sousTitre:"LIVRAISON" })}<div class="m3-pile">${colis}</div></div>`;
    });
    if (route) sonUneFois("m3-camion", "camion");
    // Le tampon a sa place dès le départ (invisible) : la ligne de signature ne bouge pas pendant que l'élève signe.
    const tampon = poser(bl && q(".sigline", bl), "afterbegin", "m3-recu", `<span class="tampon vert m3-recu m3-attente" aria-hidden="true">Reçu</span>`);
    if (tampon){
      const ok = lire(() => VALID3.reception(), false), attendait = tampon.classList.contains("m3-attente");
      tampon.classList.toggle("m3-attente", !ok);
      if (ok && attendait && COMPTA.premiereFois("m3-recu")){ tampon.classList.add("frappe"); COMPTA.son("tampon"); }
    }
    if (papiers[1]) papiers[1].classList.add("agrafe");
    const ec = q(".ecriture", main); if (ec) ec.classList.add("cpt-registre");
  }

  // ─── Prix : le bureau, la calculatrice TerrilCalc (son ruban montre le calcul) et les étiquettes de la vitrine ───
  let prixActif = 0;                                                    // l'article dont on bouge le curseur
  const multTVA = () => String(r2(1 + tvaV())).replace(".", ",");          // 1,06 ou 1,21 : le multiplicateur de la page (taux de l'activité)
  const rubanPrix = (i) => { const a = arts()[i]; return [[a.emoji + " " + a.nom, ""], ["Prix d'achat HT", euro(pa(i))], ["+ marge", euro(margeU(i))], ["= prix de vente HT", euro(pvHT(i))], [`× ${multTVA()} = prix TTC`, euro(pvTTC(i))]]; };
  function prix(main){
    const premier = q(".art", main), liste = lire(() => arts(), []); if (!premier || !liste.length) return;
    if (prixActif >= liste.length) prixActif = 0;
    const bureau = poser(premier, "beforebegin", "m3-prix", () => `<div class="bureau m3-prix kit-anim" data-anim="m3-prix" aria-hidden="true">
      <div class="m3-etiquettes"><span class="m3-etiquettes-titre">Étiquettes de la vitrine · prix TTC</span>${liste.map((a, i) => `<div class="m3-etiq${i === prixActif ? " actif" : ""}" data-m3-etiq="${i}">${COMPTA.etiquette(euro(pvTTC(i)), { titre:a.emoji + " " + a.nom, rot:[-3, 2, -1.5][i % 3] })}</div>`).join("")}</div>
      <div class="m3-calc-zone cpt-cache-mobile">${COMPTA.calculatrice({ ecran:sansEuro(euro(pvTTC(prixActif))), ruban:rubanPrix(prixActif) })}</div></div>`);
    if (bureau && COMPTA.premiereFois("m3-calc"))
      COMPTA.taperCalcul(q(".cpt-calc", bureau), sansEuro(euro(pvHT(prixActif))).replace(/\s/g, "") + "×" + multTVA() + "=", null).then(() => majPrix(prixActif));
  }
  /** Le curseur bouge : étiquettes, écran et ruban suivent (valeurs relues dans la page). */
  function majPrix(i){
    const bureau = q('#main [data-decor="m3-prix"]'); if (!bureau) return;
    qa(".m3-etiq", bureau).forEach(e => { const k = +e.getAttribute("data-m3-etiq"), et = q(".cpt-etiquette", e);
      e.classList.toggle("actif", k === i); if (et && et.lastChild) et.lastChild.textContent = euro(pvTTC(k)); });
    const val = q(".cpt-val", bureau), ruban = q(".cpt-ruban", bureau);
    if (val) val.textContent = sansEuro(euro(pvTTC(i)));
    if (ruban) ruban.innerHTML = rubanPrix(i).map(l => `<div><span>${X(l[0])}</span><b>${X(l[1])}</b></div>`).join("");
  }
  document.addEventListener("input", (e) => {
    const t = e.target; if (!t || !t.getAttribute || t.getAttribute("data-prix") == null) return;
    try { prixActif = +t.getAttribute("data-prix") || 0; majPrix(prixActif); } catch(err) { console.warn("décor :", err); }
  });

  // ─── Semaines 1 à 4 : le liège des ventes (post-it, ticket de caisse), le journal des ventes, l'extrait de compte ───
  function ticket(s, w){
    const lignes = s.ventes.filter(v => v.q > 0).map(v => `<div class="m3-tk-l"><span>${X(arts()[v.i].nom)}</span><b>${X(v.q)} × ${X(euro(v.pu))}${s.promo ? " (promo)" : ""}</b></div>`).join("")
      || `<div class="m3-tk-l"><span>Aucune vente</span><b>–</b></div>`;
    return `<div class="receipt imprime m3-ticket cpt-cache-mobile">${COMPTA.punaise("#2f6fed")}<div class="m3-tk-tete"><b>${X(entreprise())}</b><small>Rapport de caisse · semaine ${w}</small></div>${lignes}
      <div class="m3-tk-tot"><span>TOTAL TTC</span><b>${X(euro(s.caTTC))}</b></div><div class="m3-tk-l"><span>dont total HT</span><b>${X(euro(s.caHT))}</b></div>
      <div class="m3-tk-cb">${KIT.codeBarres("Z" + w + entreprise(), 24)}</div><small class="m3-tk-merci">Merci et à bientôt !</small>${COMPTA.mention()}</div>`;
  }
  function semaine(main, w){
    const sim = lire(() => SIM(), null), s = sim && sim.semaines[w - 1]; if (!s) return;
    const liege = poser(q(".coach", main), "afterend", "m3-liege", () => {
      const vendus = String((s.lignes[0] && s.lignes[0].s) || "").split(" · ")[0];      // « 10 articles », texte du relevé
      const stockTxt = s.ventes.map(v => `${arts()[v.i].emoji} ${s.stock[v.i]}`).join("  ");
      const promo = s.promo ? `<span class="m3-promo">−${X(Math.round(PROMO.remise * 100))}\u00a0%<small>PROMO</small></span>` : "";
      return `<div class="cpt-liege m3-liege kit-anim" data-anim="m3-liege-${w}" aria-hidden="true"><div class="m3-liege-grille">
        <div class="m3-liege-haut"><span class="m3-liege-titre">Ventes de la semaine ${w}</span>${promo}</div>
        <div class="m3-postits">${COMPTA.postit(`<small>Vendus en boutique</small>${X(vendus)}`, { rot:-2.5 })}${COMPTA.postit(`<small>Chiffre d'affaires HT</small>${X(euro(s.caHT))}`, { couleur:"rose", rot:1.8, couleurPunaise:"#2f6fed" })}${COMPTA.postit(`<small>Banque en fin de semaine</small>${X(euro0(s.fin))}`, { couleur:"bleu", rot:-1.4, couleurPunaise:"#e3b85c" })}${COMPTA.postit(`<small>Stock restant</small>${X(stockTxt)}`, { couleur:"vert", rot:2.2, couleurPunaise:"#9d4edd" })}</div>
        ${ticket(s, w)}</div></div>`;
    });
    if (liege) sonUneFois("m3-caisse-" + w, "caisse");
    const table = q("table.sales", main);
    if (table){ table.classList.add("m3-journal"); if (table.parentElement) table.parentElement.classList.add("m3-defile"); }
    const led = q(".ledger", main);
    if (led){
      led.classList.add("cpt-releve", "m3-releve");
      poser(led, "afterbegin", "m3-releve-tete", () => `<div class="m3-releve-tete" aria-hidden="true">${COMPTA.logoBanque()}<span class="m3-releve-titre"><b>Extrait de compte</b><small>Semaine ${w} · ${X(lire(() => M1.ids.iban, ""))}</small></span></div>`);
      poser(led, "beforeend", "m3-releve-pied", () => `<div class="m3-releve-pied" aria-hidden="true">BIC BORIBEBB · ${X(entreprise())}${COMPTA.mention()}</div>`);
    }
    if (w === 1){ const dv = papier(main, "Devis"); if (dv) dv.classList.add("m3-devis"); }
    if (w === 2) avisClient(main);
    if (w === 3){ const cp = papier(main, "Devis accepté (copie)"); if (cp) cp.classList.add("m3-devis", "agrafe"); }
    if (w === 3){
      const brouillon = q(".fact-form", main), carte = brouillon && brouillon.closest(".card");
      if (carte){ carte.classList.add("m3-brouillon"); poser(carte, "afterbegin", "m3-brouillon-tete", () => `<div class="m3-brouillon-tete" aria-hidden="true"><b>Facture de vente · brouillon</b><small>${X(entreprise())} → ${X(lire(() => march().client.nom, ""))}</small></div>`); }
      const bl = papier(main, "Bon de livraison"), cond = bl && q(".cond", bl);
      if (cond) poser(cond, "afterend", "m3-bl-signe", () => `<div class="m3-bl-signe" aria-hidden="true"><span class="tampon vert">Livré</span><span class="signed">${X(lire(() => march().client.contact, ""))}</span></div>`);
      const fv = papier(main, "Facture de vente");
      if (fv){ fv.classList.add("agrafe"); const st = q(".stamp", fv); if (st && COMPTA.premiereFois("m3-emise")){ st.classList.add("show"); COMPTA.son("tampon"); } }
    }
  }

  // ─── Résultat : le compte de résultats devient un document comptable, tampon « Bénéfice » ou « Perte » ───
  function resultat(main){
    const cr = q(".cr", main); if (!cr) return;
    const r = lire(() => SIM().resultatMois, 0);
    cr.classList.add("m3-cr");
    poser(cr, "afterbegin", "m3-cr-tete", () => `<div class="m3-doc-tete" aria-hidden="true"><span class="m3-doc-titre">Compte de résultats</span><small>${X(entreprise())} · premier mois d'activité</small></div>`);
    poser(cr, "beforeend", "m3-cr-pied", () => `<div class="m3-doc-pied" aria-hidden="true">${COMPTA.mention()}<span class="tampon${r >= 0 ? " vert" : ""} frappe" data-anim="m3-cr-tampon">${r >= 0 ? "Bénéfice" : "Perte"}</span></div>`);
    sonUneFois("m3-cr-tampon", "tampon");
  }

  // ─── Bilan (écran du bilan et écran de fin) : document officiel, balance, tampon ───
  function bilan(main, avecSon){
    const b = q(".bilan", main), d = lire(() => bilanData(4), null); if (!b || !d) return;
    b.classList.add("m3-bilan");
    poser(b, "afterbegin", "m3-bilan-tete", () => `<div class="m3-bilan-tete" aria-hidden="true"><span class="m3-doc-titre">Bilan</span><small>${X(entreprise())} · après le premier mois · ${X(lire(() => today(), ""))}</small></div>`);
    poser(b, "beforeend", "m3-bilan-pied", () => `<div class="m3-bilan-pied" aria-hidden="true">${COMPTA.balance(d.equilibre, { couleurTexte:"#14284b" })}<span class="tampon${d.equilibre ? " vert" : ""} frappe" data-anim="m3-bilan-tampon">${d.equilibre ? "Actif = Passif" : "Déséquilibré"}</span>${COMPTA.mention()}</div>`);
    if (avecSon) sonUneFois("m3-bilan-tampon", "tampon");
    // V2 : le surligneur passe une fois sur ce que le mois a changé : le stock, la créance, la TVA, le résultat, la banque
    if (COMPTA.premiereFois("m3-fluo-" + ecran())) qa(".l", b).forEach(l => { if (/^(Stock|Créance|TVA|Résultat|Banque)/.test(texte(q(".k", l) || l))) l.classList.add("m3-fluo"); });
  }
  /** V2 : l'avis du client mécontent, selon la décision (décor : rien n'est calculé). */
  const AVIS = { echanger:["★★★★★", "Échange sans discuter et super accueil. Je reviendrai !"], rembourser:["★★★★☆", "Remboursée tout de suite. Correct."], refuser:["★☆☆☆☆", "Ils refusent de reprendre un article défectueux. À éviter !"] };
  function avisClient(main){
    const carte = q(".decide", main) && q(".decide", main).closest(".card"); if (!carte) return;
    const deja = q('[data-decor="m3-avis"]', carte);
    if (deja && deja.getAttribute("data-avis") !== String(S.retour)) deja.remove();
    if (!S.retour || !AVIS[S.retour]) return;
    const el = poser(carte, "beforeend", "m3-avis", () => `<div class="m3-avis ${S.retour === "refuser" ? "m3-avis-mauvais" : ""}" data-avis="${X(S.retour)}" aria-hidden="true"><span class="m3-avis-etoiles">${AVIS[S.retour][0]}</span><span class="m3-avis-texte">« ${X(AVIS[S.retour][1])} »</span><small>Avis en ligne d'un client · ${X(entreprise())}</small></div>`);
    if (el && COMPTA.premiereFois("m3-avis-" + S.retour)) COMPTA.son(S.retour === "refuser" ? "erreur" : "succes");
  }

  // ─── Fin : la boutique allumée, en fête (fanions et guirlande lumineuse) ───
  function guirlande(){
    const c = ["#ff3d8b", "#e3b85c", "#9d4edd", "#22d3ee", "#34d399"], y = (x) => 6 + 56 * (x / 400) * (1 - x / 400);
    let fanions = "", lampes = "";
    for (let k = 0; k < 13; k++){
      const x = 16 + k * 30.7, xl = x + 15.35;
      fanions += `<path d="M${(x - 10).toFixed(1)} ${y(x - 10).toFixed(1)}L${(x + 10).toFixed(1)} ${y(x + 10).toFixed(1)}L${x.toFixed(1)} ${(y(x) + 22).toFixed(1)}z" fill="${c[k % 5]}" stroke="rgba(0,0,0,.25)" stroke-width=".6"/>`;
      if (k < 12) lampes += `<circle cx="${xl.toFixed(1)}" cy="${(y(xl) + 4).toFixed(1)}" r="6" fill="#ffe9a8" opacity=".28"/><circle cx="${xl.toFixed(1)}" cy="${(y(xl) + 4).toFixed(1)}" r="2.6" fill="#fff6d5"/>`;
    }
    return `<svg viewBox="0 0 400 46" aria-hidden="true"><path d="M0 6Q200 34 400 6" stroke="#2b2340" stroke-width="1.6" fill="none"/>${fanions}${lampes}</svg>`;
  }
  function fin(main){
    const fw = q(".duo .front-wrap", main);
    if (fw){ fw.classList.add("m3-fete"); poser(fw, "beforeend", "m3-guirlande", () => `<div class="m3-guirlande" aria-hidden="true">${guirlande()}</div>`); }
    bilan(main, false);
  }

  // ─── Mission fermée ou bloquée : la boutique, fermée, la nuit (ou vide, à louer) ───
  function vitrineFermee(){
    const t = type();
    return vitrineSVG({ nom:String(S.nom || "").trim() || "Ton enseigne", couleur:S.couleur || "#8E4EC6", couleur2:S.couleur2 || "#FFFFFF", style:S.style || "moderne",
      symbole:S.symbole || (t ? t.emoji : "★"), facade:S.facade || "", auvent:S.auvent || "", ambiance:S.ambiance || "", accueil:"", numero:S.numero || "",
      produits:t ? t.vitrine : [], equipement:[], panneau:"FERMÉ", allumee:false, nuit:true }, "m3nuit");
  }
  function nuit(main, e){
    const hero = q(".hero", main), apres = hero && (q(".nav", hero) || q("p.lead", hero)); if (!apres) return;
    const laSienne = M1 && (e === "ferme" || SESSION.bloque === "m2");      // bloquée faute d'entreprise : la boutique est encore à louer
    poser(apres, "afterend", "m3-nuit", () => `<div class="m3-nuit kit-anim" data-anim="m3-nuit" aria-hidden="true">${lire(() => laSienne ? V1(vitrineFermee) : vitrineSVG({ aLouer:true, nuit:true }, "m3nuit"), "")}</div>`);
  }

  // ─── Connexion : la pancarte « Ouvert » accrochée à la porte (grand écran seulement) ───
  function pancarte(main){
    poser(q(".hero", main), "afterbegin", "m3-pancarte", `<div class="m3-pancarte m3-oscille cpt-cache-mobile" data-anim="m3-pancarte" aria-hidden="true"><i class="m3-clou"></i><span class="m3-ficelle"></span><div class="m3-pancarte-bois"><b>Ouvert</b><small>Mission 3 · premier mois</small></div></div>`);
  }

  // ─── Tableau de bord : le stock de la réserve, en cartons ───
  function cote(){
    qa("#side .equip > div").forEach(d => { if (d.classList.contains("cur")) d.classList.add("m3-boite-vide"); else d.classList.add("cpt-carton", "m3-boite"); });
  }

  // ─── V2 : petits films (3 s au plus, comme aux 3P et en mission 2), au passage d'un écran à l'autre, par-dessus l'écran suivant ───
  const heureCourte = () => new Date().toLocaleTimeString("fr-BE", { hour:"2-digit", minute:"2-digit" });
  /** La publicité d'ouverture : les flyers dans les boîtes aux lettres, ou la publication sponsorisée sur les réseaux sociaux. */
  function filmPub(){
    const p = lire(() => PUBS.find(x => x.id === S.pub), null); if (!p || !p.coutHT) return null;
    const nom = entreprise(), adr = lire(() => V1(adresse1) + ", " + V1(adresse2), "");
    const flyer = `<div class="m3-flyer"><span class="m3-flyer-sym">${X(lire(() => M1.symbole, "★"))}</span><b>${X(nom)}</b><span class="m3-flyer-ouv">Ouverture !</span><small>${X(adr)}</small></div>`;
    if (p.id === "reseaux") return { duree:2800, texte:"Ta publicité tourne sur les réseaux sociaux…",
      html:`<div class="m3-sc m3-sc-reseaux"><div class="phone m3-sc-phone"><div class="tel-barre"><span>${X(heureCourte())}</span><span>📶 🔋</span></div>
        <div class="m3-post"><div class="m3-post-tete"><span class="m3-post-av">${X(lire(() => M1.symbole, "★"))}</span><span><b>${X(nom)}</b><small>Sponsorisé · ${X(lire(() => V1(adresse2), ""))}</small></span></div>${flyer}
        <div class="m3-post-bas"><span>❤ <b class="m3-likes">0</b></span><span>💬 <b class="m3-com">0</b></span><span>↗ Partager</span></div></div>
        <div class="m3-notif">🔔 +1 abonné · « On passe samedi ! »</div></div></div>`,
      jouer(el, ms){ const lk = el.querySelector(".m3-likes"), cm = el.querySelector(".m3-com"); let n = 0;
        const t = setInterval(() => { if (!el.isConnected) return clearInterval(t); n = Math.min(248, n + 9); lk.textContent = n; cm.textContent = Math.floor(n / 17); }, Math.max(40, Math.round(ms / 40)));
        setTimeout(() => clearInterval(t), ms);
        COMPTA.etapes(el, ms, [[.04, () => el.querySelector(".m3-post").classList.add("vu")], [.55, () => { el.querySelector(".m3-notif").classList.add("vu"); COMPTA.son("notif"); }]]); },
      final(el){ el.querySelector(".m3-post").classList.add("vu"); el.querySelector(".m3-notif").classList.add("vu"); el.querySelector(".m3-likes").textContent = "248"; el.querySelector(".m3-com").textContent = "14"; } };
    return { duree:2600, texte:"2\u202f000 flyers dans les boîtes aux lettres du quartier…",
      html:`<div class="m3-sc m3-sc-flyers">${flyer}<div class="m3-maisons">${[0, 1, 2].map(k => `<div class="m3-maison"><span class="m3-maison-toit"></span><span class="m3-maison-fen"></span><span class="m3-maison-porte"></span><span class="m3-bal-mini"><i class="m3-fl-vole"></i></span></div>`).join("")}</div></div>`,
      jouer(el, ms){ const v = el.querySelectorAll(".m3-fl-vole"); COMPTA.etapes(el, ms, [[.08, () => el.querySelector(".m3-flyer").classList.add("vu")]].concat([0, 1, 2].map(k => [.34 + k * .18, () => { v[k].classList.add("dedans"); COMPTA.son("papier"); }]))); },
      final(el){ el.querySelector(".m3-flyer").classList.add("vu"); el.querySelectorAll(".m3-fl-vole").forEach(x => x.classList.add("dedans")); } };
  }
  /** Semaine 1 : la boutique ouvre ; un client entre au comptoir, paie, la caisse sonne (chiffres de la semaine 1, lus dans la page). */
  function filmOuverture(){
    const s = lire(() => SIM().semaines[0], null); if (!s) return null;
    const v = s.ventes.slice().sort((x, y) => y.q - x.q)[0], a = v && v.q ? arts()[v.i] : null, n = s.ventes.reduce((t, x) => t + x.q, 0);
    return { duree:2800, texte:`Ouverture ! ${n} article${n > 1 ? "s" : ""} vendu${n > 1 ? "s" : ""} la première semaine`,
      html:`<div class="m3-sc m3-sc-comptoir"><div class="m3-cpt-fond"><span class="m3-cpt-pancarte">Ouvert</span><span class="m3-cpt-etagere">${arts().map(x => X(x.emoji)).join(" ")}</span></div>
        <span class="m3-cpt-client">🧑</span><div class="m3-cpt-bulle">${a ? `Bonjour ! Vous avez des ${X(a.cmd[1])} ?` : "Bonjour !"}</div>
        <div class="m3-cpt-comptoir"><div class="m3-cpt-caisse"><span class="m3-cpt-ecran"><small>Semaine 1</small>${X(euro(s.caTTC))}</span><span class="m3-cpt-tiroir"></span></div><div class="m3-cpt-tpe"><span class="m3-cpt-carte">💳</span><b>✔ Payé</b></div></div></div>`,
      jouer(el, ms){ const sc = el.querySelector(".m3-sc-comptoir"); COMPTA.etapes(el, ms, [[.04, () => { sc.classList.add("entre"); COMPTA.son("porte"); }], [.3, () => sc.classList.add("parle")], [.58, () => { sc.classList.add("paie"); COMPTA.son("bip"); }], [.74, () => { sc.classList.add("encaisse"); COMPTA.son("caisse"); }]]); },
      final(el){ el.querySelector(".m3-sc-comptoir").classList.add("entre", "parle", "paie", "encaisse"); } };
  }
  /** Semaine 2 : le courrier des échéances tombe de la boîte aux lettres (loyer, factures de la mission 2, assurances). */
  function filmCourrier(){
    const fs = lire(() => M2.factures, []), loy = lire(() => V1(loyer), 0);
    const lettres = [["🏠", "Loyer du mois", euro(loy)]].concat(fs.slice(0, 3).map(f => ["🏢", "Facture " + f.fournisseur, euro(f.montant)]), [["🔌", "Assurances, énergie", euro(CHARGES_AUTRES)]]);
    return { duree:2600, texte:"Semaine 2 : le courrier des échéances…",
      html:`<div class="m3-sc m3-sc-courrier"><div class="m3-bal"><span class="m3-bal-nom">${X(entreprise())}</span><span class="m3-bal-fente"></span></div>
        <div class="m3-lettres">${lettres.map((l, k) => `<div class="m3-lettre" style="--k:${k}"><span>${l[0]}</span><b>${X(l[1])}</b><small>${X(l[2])}</small></div>`).join("")}</div></div>`,
      jouer(el, ms){ const ls = [...el.querySelectorAll(".m3-lettre")]; COMPTA.etapes(el, ms, ls.map((x, k) => [.1 + k * .17, () => { x.classList.add("tombe"); COMPTA.son("papier"); }])); },
      final(el){ el.querySelectorAll(".m3-lettre").forEach(x => x.classList.add("tombe")); } };
  }
  /** Semaine 3 : la camionnette livre le client professionnel (si le devis a été accepté). */
  function filmLivraison(){
    const b = lire(() => SIM().b2b, null), c = lire(() => march().client, null); if (!b || !c) return null;
    return { duree:2600, texte:`Livraison : ${qteTxt(b.q, artClient())} pour ${c.nom}`,
      html:`<div class="m3-sc m3-sc-livre"><div class="m3-livre-route">${KIT.camion({ nom:entreprise(), sousTitre:"LIVRAISON", couleur:lire(() => M1.couleur, "#1E2A5A") || "#1E2A5A" })}</div>
        <div class="m3-livre-client"><span class="m3-livre-av">${X(c.avatar)}</span><b>${X(c.nom)}</b><small>${X(c.rue)}, ${X(c.cp)} ${X(c.ville)}</small><span class="tampon vert m3-livre-ok">Livré</span></div></div>`,
      jouer(el, ms){ const sc = el.querySelector(".m3-sc-livre"); COMPTA.etapes(el, ms, [[.02, () => { sc.classList.add("roule"); COMPTA.son("camion"); }], [.7, () => { sc.classList.add("livre"); COMPTA.son("tampon"); }]]); },
      final(el){ el.querySelector(".m3-sc-livre").classList.add("roule", "livre"); } };
  }
  /** Semaine 4 : la facture de vente part chez le client, sous enveloppe : de l'argent à recevoir. */
  function filmFacture(){
    const f = S.vente && S.vente.facture, c = lire(() => march().client, null); if (!f || !c) return null;
    return { duree:2200, texte:`Facture ${f.numero} envoyée : ${euro(f.ttc)} à recevoir`,
      html:`<div class="m3-sc m3-sc-enveloppe"><div class="m3-env"><div class="m3-env-facture"><b>Facture</b><small>${X(f.numero)}</small><span>${X(c.nom)}</span><span class="m3-env-montant">${X(euro(f.ttc))}</span></div><span class="m3-env-corps"></span><span class="m3-env-rabat"></span></div><div class="m3-sc-ok">✔ Envoyée</div></div>`,
      jouer(el, ms){ const sc = el.querySelector(".m3-sc-enveloppe"); COMPTA.etapes(el, ms, [[.22, () => { sc.classList.add("glisse"); COMPTA.son("papier"); }], [.48, () => sc.classList.add("ferme")], [.64, () => { sc.classList.add("part"); COMPTA.son("envoi"); }]]); },
      final(el){ el.querySelector(".m3-sc-enveloppe").classList.add("glisse", "ferme", "part"); } };
  }
  /** Au passage d'un écran à l'autre (pas au chargement de la page) : le film de ce qui vient de se passer. */
  let precedent = null;
  function films(e){
    if (precedent === e) return;
    const avant = precedent; precedent = e;
    if (!avant || MODE !== "mission") return;
    const f = avant === "stock" && e === "reception" ? filmPub() : avant === "prix" && e === "s1" ? filmOuverture() : avant === "s1" && e === "s2" ? filmCourrier()
      : avant === "s2" && e === "s3" ? filmLivraison() : avant === "s3" && e === "s4" ? filmFacture() : null;
    if (f) COMPTA.film(Object.assign({ cle:"m3-" + e }, f));
  }

  function decorer(){
    try {
      const main = document.getElementById("main"); if (!main) return;
      COMPTA.coachs(document);                                        // Nadia dessinée à la place de l'émoji
      const e = ecran();
      if (e === "login") pancarte(main);
      else if (e === "briefing") briefing(main);
      else if (e === "stock") stock(main);
      else if (e === "reception") reception(main);
      else if (e === "prix") prix(main);
      else if (/^s[1-4]$/.test(e)) semaine(main, +e.slice(1));
      else if (e === "resultat") resultat(main);
      else if (e === "bilan") bilan(main, true);
      else if (e === "fin") fin(main);
      else if (e === "ferme" || e === "bloque") nuit(main, e);
      cote();
      COMPTA.cascade(main, e);                                        // V2 : les blocs de l'écran arrivent l'un après l'autre (une fois)
      COMPTA.xpSaute(S.xp || 0);
      films(e);
      typo(document.body);                                            // V2 : en dernier, film compris
    } catch(e) { console.warn("décor :", e); }
  }
  // ─── Accroche (seules affectations permises : render, refreshLive, vitrine, toast, confetti) ───
  const renduOrigine = render, rafraichiOrigine = refreshLive, toastOrigine = toast, confettiOrigine = confetti;
  render = function(scroll){ renduOrigine(scroll); decorer(); };
  refreshLive = function(){ rafraichiOrigine(); decorer(); };
  vitrine = COMPTA.vitrineEQ;                                         // façade réaliste : mêmes choix, mêmes valeurs par défaut
  toast = function(html, cls){ toastOrigine(html, cls); typo(document.getElementById("toasts")); COMPTA.son(cls === "word" ? "notif" : /^<b>\+\d+ XP/.test(String(html)) ? "xp" : "notif"); };
  confetti = function(){ confettiOrigine(); COMPTA.son("fanfare"); };
  window.__decor = { renduOrigine, decorer, ecran };
  COMPTA.creditsImages();                                             // crédits des photos de matières (CC0), au bas de la page
  COMPTA.vivant();                                                    // V2 : cartes qui réagissent, reflets, notifications façon téléphone
  if (document.querySelector("#main svg.front, #side svg.front")) render(); else decorer();
  return { decorer, ecran };
})();
// ═══ DÉCOR MISSION 3 — fin ═══
</script>
