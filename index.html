<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 3 – Ta première commande client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,700&family=Fredoka:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0618; --bg-0:#120827; --bg-1:#1a1033;
  --pink:#ff3d8b; --magenta:#e935c5; --violet:#9d4edd; --indigo:#6366f1; --cyan:#22d3ee; --sky:#38bdf8;
  --lime:#a3e635; --emerald:#34d399; --orange:#fb923c; --yellow:#fbbf24;
  --white:#fff; --text:rgba(255,255,255,.92); --soft:rgba(255,255,255,.7); --dim:rgba(255,255,255,.5);
  --border:rgba(255,255,255,.13); --border-soft:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.055); --glass-hover:rgba(255,255,255,.09); --glass-strong:rgba(18,8,39,.72);
  --grad:linear-gradient(120deg,var(--pink),var(--magenta) 35%,var(--violet) 70%,var(--indigo));
  --brand:#e935c5; --on-brand:#fff;
  --paper:#fff; --paper-ink:#1D1F33; --paper-line:#D5D8E6;
  --r:18px; --r-lg:26px;
  --ui:'Outfit','Segoe UI',Arial,sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'Space Mono',Consolas,monospace;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:var(--ui); background:var(--bg-deep); color:var(--text); min-height:100vh; font-size:18px; line-height:1.5; overflow-x:hidden}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
[hidden]{display:none !important}

/* ═══ Fond festif : blobs animés + grain ═══ */
.mesh{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
.blob{position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; mix-blend-mode:screen}
.b1{width:520px;height:520px;background:var(--pink);top:-80px;left:-120px;animation:d1 22s ease-in-out infinite}
.b2{width:460px;height:460px;background:var(--violet);top:10%;right:-100px;animation:d2 26s ease-in-out infinite}
.b3{width:540px;height:540px;background:var(--cyan);top:40%;left:20%;opacity:.3;animation:d3 30s ease-in-out infinite}
.b4{width:420px;height:420px;background:var(--orange);bottom:5%;right:15%;opacity:.33;animation:d4 24s ease-in-out infinite}
.b5{width:380px;height:380px;background:var(--magenta);bottom:-120px;left:30%;animation:d5 28s ease-in-out infinite}
@keyframes d1{50%{transform:translate(80px,120px) scale(1.15)}} @keyframes d2{50%{transform:translate(-100px,150px) scale(1.1)}}
@keyframes d3{50%{transform:translate(120px,-80px) scale(1.2)}} @keyframes d4{50%{transform:translate(-90px,-120px) scale(1.1)}}
@keyframes d5{50%{transform:translate(110px,-60px) scale(1.15)}}
body::after{content:''; position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.06; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E")}

/* ═══ Bandeau événement ═══ */
.banner{position:relative; z-index:10; color:#fff; text-align:center; padding:10px 20px; font-size:15px; font-weight:600; letter-spacing:.02em;
  background:linear-gradient(90deg,var(--pink),var(--magenta) 25%,var(--violet) 50%,var(--indigo) 75%,var(--cyan)); background-size:200% 100%;
  animation:bshift 10s linear infinite; box-shadow:0 4px 30px rgba(233,53,197,.3)}
.pulse{display:inline-block; width:8px; height:8px; background:#fff; border-radius:50%; margin-right:10px; vertical-align:middle; animation:pd 1.3s ease-in-out infinite}
@keyframes pd{50%{transform:scale(1.2); box-shadow:0 0 0 10px rgba(255,255,255,0)}}
@keyframes bshift{to{background-position:200% 0}}

/* ═══ Barre du haut ═══ */
.top{position:sticky; top:0; z-index:20; background:rgba(10,6,24,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-bottom:1px solid var(--border-soft)}
.top-in{max-width:1280px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:16px}
.logo{width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--magenta) 40%,var(--violet)); display:grid; place-items:center;
  font-family:var(--serif); font-weight:700; color:#fff; font-size:16px; box-shadow:0 0 20px rgba(233,53,197,.5); flex:none}
.top h1{font-family:var(--serif); font-weight:600; font-size:20px; line-height:1.1}
.top h1 small{display:block; font-family:var(--ui); font-size:14px; font-weight:500; color:var(--soft)}
.right{margin-left:auto; display:flex; align-items:center; gap:14px}
.who{font-size:14px; color:var(--soft); text-align:right; line-height:1.25}
.who b{display:block; color:var(--text); font-size:15px}
.who button{background:none; border:0; color:var(--dim); text-decoration:underline; cursor:pointer; font-size:13px}
.xp-pill{font-family:var(--mono); font-weight:700; padding:7px 16px; border-radius:999px; color:#fff; background:var(--glass); border:1px solid var(--border); white-space:nowrap}
.xp-pill span{background:linear-gradient(90deg,var(--yellow),var(--orange)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.lvl{font-size:13px; color:var(--soft); text-align:right; line-height:1.2}
.lvl b{display:block; color:var(--text); font-size:14px}
.steps{max-width:1280px; margin:0 auto; padding:0 24px 12px; display:grid; grid-template-columns:repeat(11,1fr); gap:6px}
.seg{height:7px; border-radius:6px; background:rgba(255,255,255,.1); position:relative}
.seg.done{background:var(--grad)}
.seg.now{background:linear-gradient(90deg,var(--yellow),var(--orange)); box-shadow:0 0 14px rgba(251,191,36,.6)}
.seg span{position:absolute; top:11px; left:0; font-size:12px; color:var(--yellow); white-space:nowrap; display:none}
.seg.now span{display:block}

/* ═══ Mise en page ═══ */
.wrap{position:relative; z-index:2}
.layout{max-width:1280px; margin:0 auto; padding:38px 24px 70px; display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:32px; align-items:start}
.layout.full{grid-template-columns:minmax(0,1fr); max-width:1100px}
main{min-width:0}
.glass{background:var(--glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:var(--r-lg)}
.card{padding:28px}
.chip-label{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--text); background:var(--glass); border:1px solid var(--border); padding:6px 16px; border-radius:999px; margin-bottom:14px}
.led{width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 10px var(--lime)}
h2.title{font-family:var(--serif); font-weight:600; font-size:clamp(30px,3.6vw,42px); line-height:1.1; letter-spacing:-.01em; color:#fff; margin-bottom:10px}
.grad{background:linear-gradient(120deg,var(--pink),var(--magenta) 30%,var(--violet) 60%,var(--cyan)); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-style:italic; font-weight:500; animation:gs 8s ease-in-out infinite}
@keyframes gs{50%{background-position:100% 50%}}
p.lead{color:var(--soft); font-size:19px; margin-bottom:22px; max-width:64ch}
.coach{display:flex; gap:14px; align-items:flex-start; padding:14px 18px; margin-bottom:24px; max-width:760px; border-radius:var(--r)}
.coach .av{flex:none; width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--yellow),var(--orange)); display:grid; place-items:center; font-size:22px; box-shadow:0 0 18px rgba(251,146,60,.45)}
.coach b{color:var(--yellow)}
h3.sub{font-family:var(--serif); font-weight:600; font-size:22px; margin:26px 0 12px; color:#fff}
.sector-h{display:flex; align-items:center; gap:12px; margin:28px 0 14px}
.sector-h .rule{flex:1; height:1px; background:var(--border)}

/* ═══ Cartes de choix ═══ */
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.choice{--g1:var(--pink); --g2:var(--violet); position:relative; text-align:left; width:100%; color:var(--text); background:var(--glass);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:22px; padding:18px 20px; cursor:pointer;
  transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .3s, background .2s}
.choice::before{content:''; position:absolute; inset:-1px; border-radius:22px; padding:2px; background:linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity .3s; pointer-events:none}
.choice:hover{transform:translateY(-4px); background:var(--glass-hover)}
.choice:hover::before{opacity:.6}
.choice.on{background:color-mix(in srgb,var(--g1) 14%,transparent); box-shadow:0 16px 44px color-mix(in srgb,var(--g1) 30%,transparent)}
.choice.on::before{opacity:1}
.choice.on::after{content:"✓"; position:absolute; top:12px; right:14px; width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--g1),var(--g2)); color:#fff; display:grid; place-items:center; font-weight:800; font-size:16px}
.choice.off{opacity:.4}
.choice.full{opacity:.45; cursor:not-allowed}
.choice.full:hover{transform:none}
.sec-primaire{--g1:var(--lime); --g2:var(--emerald)}
.sec-secondaire{--g1:var(--cyan); --g2:var(--sky)}
.sec-tertiaire{--g1:var(--pink); --g2:var(--magenta)}
.choice .ico{width:62px; height:62px; border-radius:18px; display:grid; place-items:center; font-size:30px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
  box-shadow:0 10px 26px color-mix(in srgb,var(--g1) 30%,transparent); transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.choice:hover .ico{transform:scale(1.1) rotate(-6deg)}
.choice h4{font-family:var(--serif); font-weight:600; font-size:21px; margin:12px 0 6px; padding-right:32px; color:#fff}
.choice p{color:var(--soft); font-size:16px}
.choice .meta{margin-top:12px; font-size:15px}
.choice .meta div{margin-top:3px}
.choice .meta b{color:var(--g1); font-weight:600}
.tag{display:inline-block; font-size:13px; font-weight:600; padding:4px 12px; border-radius:999px; background:rgba(0,0,0,.28); color:#fff; border:1px solid var(--border); margin-top:12px}
.tag.full{background:rgba(255,61,139,.2); border-color:var(--pink)}
.counter{font-family:var(--mono); font-weight:700; color:var(--yellow)}

/* ═══ Formulaires ═══ */
label.f{display:block; font-weight:600; margin-bottom:6px}
.inp{width:100%; background:rgba(10,6,24,.55); color:#fff; border:1px solid var(--border); border-radius:14px; padding:13px 16px; font-size:18px}
.inp:focus{border-color:var(--magenta); outline:none; box-shadow:0 0 0 4px rgba(233,53,197,.2)}
.inp::placeholder{color:var(--dim)}
select.inp option{background:var(--bg-1); color:#fff}
.row{display:grid; gap:16px; grid-template-columns:repeat(2,minmax(0,1fr)); margin-bottom:16px}
.row3{grid-template-columns:2fr 1fr 1fr}
.chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px}
.chip{background:var(--glass); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:8px 18px; cursor:pointer; font-size:16px; transition:all .2s}
.chip:hover{background:var(--glass-hover); transform:translateY(-2px)}
.chip.on{background:var(--grad); border-color:transparent; color:#fff}
.help{font-size:15px; color:var(--soft); margin-top:6px}
.err{color:#ffb4c8; font-size:16px; margin-top:10px}

/* ═══ Boutons ═══ */
.nav{display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:30px; flex-wrap:wrap}
.btn{border:0; border-radius:14px; padding:14px 28px; font-weight:700; font-size:18px; cursor:pointer; transition:transform .25s, box-shadow .25s}
.btn-main{background:var(--grad); color:#fff; box-shadow:0 10px 30px rgba(233,53,197,.35)}
.btn-main:hover{transform:translateY(-2px); box-shadow:0 14px 36px rgba(233,53,197,.5)}
.btn-main:disabled{background:rgba(255,255,255,.1); color:var(--dim); box-shadow:none; cursor:not-allowed; transform:none}
.btn-ghost{background:var(--glass); color:var(--text); border:1px solid var(--border)}
.btn-ghost:hover{background:var(--glass-hover)}
.btn-gold{background:linear-gradient(90deg,var(--yellow),var(--orange)); color:#1a1033}
.hint{color:var(--soft); font-size:15px}
.busy{opacity:.7; pointer-events:none}

/* ═══ Défi bonus ═══ */
.bonus{margin-top:26px; border:2px dashed var(--yellow); border-radius:var(--r); padding:18px 20px; background:rgba(251,191,36,.06)}
.bonus h4{color:var(--yellow); font-size:18px; margin-bottom:4px}
.bonus p{color:var(--soft); font-size:16px; margin-bottom:12px}
.bonus.won{border-style:solid; border-color:var(--emerald); background:rgba(52,211,153,.08)}
.bonus.won h4{color:var(--emerald)}

/* ═══ Enseigne ═══ */
aside{position:sticky; top:128px}
.sign{overflow:hidden}
.sign-face{min-height:175px; background:var(--brand); color:var(--on-brand); padding:22px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; transition:background .4s; position:relative}
.sign-face::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 60%); pointer-events:none}
.sign-face.empty{background:linear-gradient(135deg,rgba(255,61,139,.25),rgba(157,78,221,.25)); color:var(--soft)}
.sign-face .emb{width:60px; height:60px; border-radius:50%; background:var(--on-brand); color:var(--brand); display:grid; place-items:center; font-size:28px; margin-bottom:10px}
.sign-face .nm{font-size:30px; line-height:1.1; font-weight:800; word-break:break-word}
.sign-face .sl{font-size:15px; margin-top:6px; opacity:.9}
.sign-body{padding:18px 20px}
.sign-body h3{font-size:15px; color:var(--soft); font-weight:600; margin-bottom:8px}
.srow{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--border-soft); font-size:15px}
.srow:first-of-type{border-top:0}
.srow .k{width:100px; flex:none; color:var(--dim)}
.srow .v{flex:1; min-width:0}
.srow .v.todo{color:var(--dim); font-style:italic}
.srow .v.mono{font-family:var(--mono); font-size:14px}
.pbar{height:8px; background:rgba(255,255,255,.1); border-radius:6px; margin-top:12px; overflow:hidden}
.pbar i{display:block; height:100%; background:var(--grad); transition:width .4s}

/* ═══ Styles de logo ═══ */
.f-moderne{font-family:var(--ui); font-weight:800}
.f-elegant{font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:700}
.f-fun{font-family:'Fredoka','Comic Sans MS',sans-serif; font-weight:600}
.f-street{font-family:'Bebas Neue',Impact,sans-serif; font-weight:400; letter-spacing:1.5px}
.swatches{display:flex; flex-wrap:wrap; gap:14px; padding-bottom:26px}
.sw{width:60px; height:60px; border-radius:50%; border:3px solid transparent; cursor:pointer; position:relative; transition:transform .25s}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:#fff; box-shadow:0 0 0 4px var(--bg-deep) inset, 0 0 22px rgba(255,255,255,.35)}
.sw span{position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--soft); white-space:nowrap}
.stylebtn{font-size:28px; text-align:center; padding:20px 10px}
.stylebtn small{display:block; font-family:var(--ui); font-size:14px; color:var(--soft); font-style:normal; letter-spacing:0; font-weight:500; margin-top:4px}

/* ═══ Carte d'identité ═══ */
.idcard{max-width:720px; margin:6px auto 0; background:linear-gradient(135deg,#F8F9FF,#ECEAFB); color:var(--paper-ink); border-radius:22px; padding:26px 28px 26px 34px; box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 60px rgba(233,53,197,.25); position:relative; overflow:hidden}
.idcard::before{content:""; position:absolute; inset:0 auto 0 0; width:12px; background:var(--brand)}
.idcard .hd{display:flex; align-items:center; gap:16px; border-bottom:2px solid var(--paper-line); padding-bottom:14px; margin-bottom:12px}
.idcard .emb{width:62px; height:62px; border-radius:14px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; font-size:30px; flex:none}
.idcard .hd h3{font-size:26px; line-height:1.1}
.idcard .hd p{color:#5B5F7A; font-size:15px; margin-top:2px}
.idgrid{display:grid; grid-template-columns:190px 1fr; gap:8px 16px; font-size:17px}
.idgrid .k{color:#5B5F7A}
.num{font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:.5px; background:#FFF3C4; border-radius:6px; padding:1px 8px; display:inline-block}
.stamp{position:absolute; right:22px; bottom:18px; transform:rotate(-12deg); border:3px solid #2E9E5B; color:#2E9E5B; font-weight:800; padding:4px 12px; border-radius:8px; font-size:16px; opacity:0}
.stamp.show{animation:stamp .5s .9s forwards}
@keyframes stamp{from{opacity:0; transform:rotate(-12deg) scale(2)} to{opacity:.9; transform:rotate(-12deg) scale(1)}}
.fict{font-size:12px; color:#7A7E98; margin-top:12px}

/* ═══ Document ═══ */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tab{background:var(--glass); color:var(--soft); border:1px solid var(--border); border-radius:999px; padding:8px 18px; cursor:pointer; font-size:15px}
.tab.on{background:#fff; color:var(--bg-deep); font-weight:700}
.paper{background:var(--paper); color:var(--paper-ink); border-radius:8px; padding:40px 44px; box-shadow:0 24px 70px rgba(0,0,0,.55); font-size:16px; line-height:1.45; max-width:840px}
.paper p{margin-bottom:10px}
.paper .dh{display:flex; justify-content:space-between; gap:24px; align-items:flex-start}
.paper .from{display:flex; gap:14px; align-items:flex-start}
.paper .from .emb{width:54px; height:54px; border-radius:12px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; font-size:26px; flex:none}
.paper .from .co{font-size:22px; line-height:1.15}
.paper .from p{margin:4px 0 0; font-size:14px; color:#4A4E68}
.paper .from .ids{font-family:var(--mono); font-size:12.5px}
.paper .to{border:1px solid var(--paper-line); border-radius:8px; padding:12px 16px; min-width:240px; font-size:15px}
.paper .to .lbl{font-size:12px; color:#6B6F88; margin-bottom:2px}
.paper .place{text-align:right; margin:26px 0 8px; font-size:15px}
.paper h3.doc{font-size:24px; margin:4px 0 2px; letter-spacing:.5px}
.paper .ref{font-family:var(--mono); font-size:14px; color:#4A4E68; margin-bottom:18px}
.paper table{width:100%; border-collapse:collapse; margin:14px 0}
.paper th{background:#F0F2FA; text-align:left; font-size:14px; padding:9px 10px; border-bottom:2px solid var(--paper-ink)}
.paper td{padding:9px 10px; border-bottom:1px solid var(--paper-line)}
.paper td.q{width:130px}
.paper input.qin{width:100px; border:2px dashed #8A8FB0; border-radius:6px; padding:6px 8px; font-family:var(--mono); font-size:16px; text-align:right; color:var(--paper-ink); background:#FFFBEA}
.paper input.qin:focus{border-style:solid; border-color:var(--paper-ink); outline:none}
.paper input.qin.ok{border-style:solid; border-color:#2E9E5B; background:#EFFAF3}
.paper select.din{border:2px dashed #8A8FB0; border-radius:6px; padding:6px 8px; background:#FFFBEA; color:var(--paper-ink); font-size:15px}
.paper .sig{margin-top:26px; display:flex; justify-content:flex-end}
.paper .sig div{text-align:center; min-width:260px}
.paper .sig input{width:100%; border:0; border-bottom:2px dashed #8A8FB0; font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:24px; text-align:center; padding:4px; background:#FFFBEA; color:#2A2F7A}
.paper .sig input:focus{outline:none; border-bottom-style:solid}
.paper .sig .signed{font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:24px; color:#2A2F7A}
.paper .sig small{display:block; color:#6B6F88; font-size:13px; margin-top:4px}
.paper .foot{margin-top:30px; border-top:1px solid var(--paper-line); padding-top:8px; font-size:11.5px; color:#8A8FA8; text-align:center}
.checklist{list-style:none; margin-top:18px; display:grid; gap:6px}
.checklist li{font-size:16px; color:var(--soft)}
.checklist li.ok{color:var(--emerald)}
.checklist li::before{content:"○ "}
.checklist li.ok::before{content:"✓ "}

/* ═══ Héros (connexion, fermeture, fin) ═══ */
.hero{position:relative; text-align:center; padding:40px 0 20px}
.confetti-layer{position:absolute; inset:-40px 0 0; overflow:hidden; pointer-events:none; z-index:0}
.confetti-layer span{position:absolute; display:block; opacity:0; animation:cfall linear infinite}
.confetti-layer span:nth-child(1){left:5%;width:8px;height:14px;background:var(--pink);animation-duration:13s}
.confetti-layer span:nth-child(2){left:13%;width:10px;height:5px;background:var(--cyan);animation-duration:15s;animation-delay:2.5s;border-radius:50%}
.confetti-layer span:nth-child(3){left:22%;width:7px;height:7px;background:var(--yellow);animation-duration:11s;animation-delay:4s;border-radius:50%}
.confetti-layer span:nth-child(4){left:31%;width:5px;height:15px;background:var(--violet);animation-duration:14s;animation-delay:1s}
.confetti-layer span:nth-child(5){left:40%;width:9px;height:9px;background:var(--lime);animation-duration:16s;animation-delay:3s;border-radius:50%}
.confetti-layer span:nth-child(6){left:49%;width:12px;height:6px;background:var(--magenta);animation-duration:12s;animation-delay:5.5s}
.confetti-layer span:nth-child(7){left:58%;width:6px;height:12px;background:var(--orange);animation-duration:14s;animation-delay:2s}
.confetti-layer span:nth-child(8){left:67%;width:8px;height:8px;background:var(--cyan);animation-duration:11s;animation-delay:6s;border-radius:50%}
.confetti-layer span:nth-child(9){left:76%;width:5px;height:14px;background:var(--pink);animation-duration:15s}
.confetti-layer span:nth-child(10){left:85%;width:10px;height:6px;background:var(--yellow);animation-duration:13s;animation-delay:3.5s}
.confetti-layer span:nth-child(11){left:93%;width:8px;height:8px;background:var(--emerald);animation-duration:16s;animation-delay:2s;border-radius:50%}
@keyframes cfall{0%{transform:translateY(-60px) rotate(0);opacity:0} 10%{opacity:.9} 90%{opacity:.9} 100%{transform:translateY(720px) rotate(720deg);opacity:0}}
.hero > *:not(.confetti-layer){position:relative; z-index:1}
.badge-school{display:inline-flex; align-items:center; gap:12px; padding:8px 22px 8px 10px; border-radius:999px; margin-bottom:28px}
.hero h2{font-family:var(--serif); font-weight:600; font-size:clamp(40px,6vw,68px); line-height:1.03; letter-spacing:-.02em; color:#fff; margin-bottom:22px}
.hero .sub{color:var(--soft); font-size:clamp(17px,1.6vw,20px); max-width:640px; margin:0 auto 28px; line-height:1.55}
.hero-meta{display:inline-flex; flex-wrap:wrap; justify-content:center; gap:10px}
.meta-chip{display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:999px; font-size:15px; font-weight:500}
.login{max-width:560px; margin:36px auto 0; text-align:left}
.road{list-style:none; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:26px}
.road li{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r)}
.road li .n{font-family:var(--mono); font-weight:700; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.1); color:var(--soft); flex:none}
.road li.now{border-color:rgba(251,191,36,.6); box-shadow:0 0 30px rgba(251,191,36,.15)}
.road li.now .n{background:linear-gradient(135deg,var(--yellow),var(--orange)); color:#1a1033}
.road li .t{flex:1; text-align:left}
.road li .t small{display:block; color:var(--dim); font-size:13px}
.spin{display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; vertical-align:middle; margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ═══ Fin ═══ */
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:22px 0}
.stat{padding:18px; text-align:center}
.stat b{display:block; font-family:var(--mono); font-size:32px; background:linear-gradient(90deg,var(--yellow),var(--orange)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.stat span{color:var(--soft); font-size:15px}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.badge{padding:14px; text-align:center; border-radius:var(--r)}
.badge .i{font-size:30px}
.badge b{display:block; font-size:15px; margin-top:4px}
.badge.lockd{opacity:.35}
.words{display:grid; gap:10px}
.word{background:rgba(255,255,255,.05); border-left:5px solid var(--magenta); border-radius:12px; padding:12px 16px}
.word b{font-size:18px; color:#fff}
.word span{display:block; color:var(--soft); font-size:16px}
.status{border-radius:var(--r); padding:14px 18px; margin-top:18px; font-size:16px}
.status.ok{background:rgba(52,211,153,.12); border:1px solid var(--emerald)}
.status.wait{background:rgba(56,189,248,.1); border:1px solid var(--sky)}
.status.err{background:rgba(255,61,139,.12); border:1px solid var(--pink)}
.next{margin-top:22px; padding:18px 22px; display:flex; gap:16px; align-items:center; border-radius:var(--r-lg)}
.next .ic{font-size:40px}

/* ═══ Toasts, modale, confettis ponctuels ═══ */
#toasts{position:fixed; right:22px; bottom:22px; z-index:50; display:grid; gap:10px; pointer-events:none}
.toast{pointer-events:none; background:var(--glass-strong); backdrop-filter:blur(18px); border:1px solid rgba(251,191,36,.6); border-radius:var(--r); padding:12px 18px; min-width:270px; box-shadow:0 12px 30px rgba(0,0,0,.45); animation:tin .35s ease-out}
.toast b{font-family:var(--mono); font-size:20px; color:var(--yellow)}
.toast .wd{color:var(--soft); font-size:15px}
.toast.word{border-color:rgba(233,53,197,.7)}
.toast.word b{font-family:var(--serif); color:#ff8fd0}
@keyframes tin{from{transform:translateY(20px); opacity:0} to{transform:none; opacity:1}}
.modal{position:fixed; inset:0; z-index:70; background:rgba(5,3,14,.8); display:grid; place-items:center; padding:20px}
.modal .box{padding:24px; max-width:780px; width:100%; max-height:86vh; overflow:auto; background:var(--bg-1)}
.modal pre{background:rgba(0,0,0,.35); padding:14px; border-radius:12px; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word; color:#E6DDFF; margin:12px 0}
.confetti{position:fixed; top:-20px; width:10px; height:16px; z-index:65; pointer-events:none; animation:fall2 linear forwards}
@keyframes fall2{to{transform:translateY(110vh) rotate(720deg)}}
.fly{position:fixed; z-index:60; font-size:44px; pointer-events:none; animation:fly 1.4s cubic-bezier(.5,0,.6,1) forwards}
@keyframes fly{to{transform:translate(70vw,-60vh) scale(.4) rotate(20deg); opacity:0}}


/* ═══ Briefing ═══ */
.brief{max-width:900px; margin:0 auto}
.goals{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:22px 0}
.goal{padding:18px 20px; border-radius:var(--r)}
.goal .gi{font-size:30px}
.goal b{display:block; font-family:var(--serif); font-size:20px; color:#fff; margin:6px 0 4px}
.goal p{color:var(--soft); font-size:16px}
.warn{display:flex; gap:14px; align-items:center; padding:18px 20px; border-radius:var(--r); border:1px solid rgba(251,191,36,.55); background:rgba(251,191,36,.08)}
.warn .wi{font-size:34px}
.warn b{color:var(--yellow)}
.today{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
/* ═══ Stratégies ═══ */
.strat{text-align:left}
.strat .big{font-size:40px}
.strat .ex{margin-top:10px; padding:10px 12px; border-radius:12px; background:rgba(0,0,0,.25); font-size:15px; color:var(--text)}
.strat .ex b{color:var(--g1)}
.st-petit{--g1:var(--lime); --g2:var(--emerald)}
.st-milieu{--g1:var(--sky); --g2:var(--indigo)}
.st-haut{--g1:var(--yellow); --g2:var(--orange)}
.gauge{display:flex; gap:4px; margin-top:10px}
.gauge i{flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,.12)}
.gauge i.on{background:linear-gradient(90deg,var(--g1),var(--g2))}
.glab{display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin-top:4px}
/* ═══ Logo ═══ */
.logo-prev{display:flex; align-items:center; gap:18px; padding:20px; border-radius:var(--r); background:rgba(255,255,255,.95); color:#1D1F33; margin-bottom:22px}
.lg-mark{width:74px; height:74px; border-radius:50%; display:grid; place-items:center; font-size:36px; flex:none; box-shadow:0 8px 20px rgba(0,0,0,.2)}
.lg-name{font-size:34px; line-height:1.05}
.lg-sl{font-size:15px; color:#555a76; margin-top:4px}
.sym{width:64px; height:64px; border-radius:16px; font-size:32px; display:grid; place-items:center; background:var(--glass); border:2px solid var(--border); cursor:pointer; transition:transform .2s}
.sym:hover{transform:translateY(-3px)}
.sym.on{border-color:#fff; background:rgba(255,255,255,.18); box-shadow:0 0 20px rgba(255,255,255,.3)}
.sw.small{width:46px; height:46px}
/* ═══ Vitrine ═══ */
.front{width:100%; height:auto; display:block}
.front-wrap{border-radius:var(--r-lg); overflow:hidden; background:linear-gradient(180deg,#1b1340,#2a1a4d)}
.opt-row{display:flex; flex-wrap:wrap; gap:10px}
.opt{padding:10px 18px; border-radius:14px; background:var(--glass); border:1px solid var(--border); color:var(--text); cursor:pointer; font-size:16px; display:flex; align-items:center; gap:8px}
.opt:hover{background:var(--glass-hover)}
.opt.on{background:var(--grad); border-color:transparent; color:#fff}
.opt .dot{width:18px; height:18px; border-radius:50%; border:1px solid rgba(255,255,255,.4)}
.boutique-grid{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:22px; align-items:start}
.boutique-grid .front-wrap{position:sticky; top:130px}
/* ═══ Argent ═══ */
.money{display:flex; align-items:center; gap:14px; padding:16px 20px; border-radius:var(--r); margin-top:16px}
.money .mi{font-size:32px}
.money b{font-family:var(--mono); font-size:22px; color:var(--emerald)}
.cost{display:inline-block; margin-top:10px; font-family:var(--mono); font-weight:700; font-size:15px; padding:4px 10px; border-radius:8px; background:rgba(255,61,139,.18); color:#ffb4c8}
.pro, .con{display:block; font-size:15px; margin-top:6px}
.pro{color:#b5f5c8} .con{color:#ffc4d4}
/* ═══ Patrimoine ═══ */
.patri{max-width:720px; margin:22px auto 0; background:#fff; color:#1D1F33; border-radius:18px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.45)}
.patri h4{background:var(--brand); color:var(--on-brand); padding:12px 20px; font-size:18px}
.pcols{display:grid; grid-template-columns:1fr 1fr}
.pcol{padding:14px 20px}
.pcol + .pcol{border-left:2px solid #E3E5EF}
.pcol h5{font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:#6B6F88; margin-bottom:8px}
.pl{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed #E3E5EF; font-size:16px}
.pl span:last-child{font-family:var(--mono); font-weight:700; white-space:nowrap}
.pl.neg span:last-child{color:#C0392B}
.ptot{display:flex; justify-content:space-between; padding:10px 20px; background:#F4F2FB; font-weight:700; font-size:17px}
.ptot span:last-child{font-family:var(--mono)}
/* ═══ Carte de visite ═══ */
.biz{width:100%; max-width:440px; aspect-ratio:85/55; background:#fff; color:#1D1F33; border-radius:14px; box-shadow:0 18px 40px rgba(0,0,0,.45); display:grid; grid-template-columns:34% 66%; overflow:hidden}
.biz .l{background:var(--brand); display:grid; place-items:center; align-content:center; gap:8px; padding:10px}
.biz .l .lg-mark{width:64px; height:64px; font-size:30px}
.biz .r{padding:16px 18px; display:flex; flex-direction:column; justify-content:center; gap:2px; font-size:13px; color:#4A4E68}
.biz .r .bn{font-size:22px; color:#1D1F33; line-height:1.1}
.biz .r .bs{font-size:12px; margin-bottom:8px}
.biz .r .who2{font-weight:700; color:#1D1F33; font-size:14px}
.duo{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:22px; align-items:center; margin-top:18px}
/* ═══ Déclaration ═══ */
.decl{max-width:760px; background:#fff; color:#1D1F33; border-radius:10px; padding:32px 36px; box-shadow:0 24px 60px rgba(0,0,0,.5)}
.decl h3{font-family:var(--serif); font-size:26px; margin-bottom:4px}
.decl .sub2{color:#6B6F88; margin-bottom:16px}
.decl ul{list-style:none; display:grid; gap:6px; margin:10px 0 18px}
.decl li{display:flex; gap:10px; border-bottom:1px dashed #E3E5EF; padding:6px 0; font-size:16px}
.decl li b{min-width:190px; color:#4A4E68; font-weight:600}
.engage{display:flex; gap:12px; align-items:flex-start; background:#FFF8E1; border:2px solid #F5C451; border-radius:10px; padding:14px 16px; cursor:pointer; font-size:16px}
.engage input{width:24px; height:24px; margin-top:2px; accent-color:#E935C5}
.decl .sigl{margin-top:22px; display:flex; justify-content:flex-end}
.decl .sigl div{text-align:center; min-width:280px}
.decl .sigl input{width:100%; border:0; border-bottom:2px dashed #8A8FB0; font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:26px; text-align:center; padding:4px; background:#FFFBEA; color:#2A2F7A}
.decl .sigl input:focus{outline:none; border-bottom-style:solid}
.decl .sigl small{display:block; color:#6B6F88; font-size:13px; margin-top:4px}
.decl .signed{font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:26px; color:#2A2F7A}
.chk{list-style:none; display:grid; gap:4px; margin-top:12px}
.chk li{font-size:14px; color:var(--dim)}
.chk li.ok{color:var(--emerald)}
.chk li::before{content:"○ "} .chk li.ok::before{content:"✓ "}
@media (max-width:1000px){ .boutique-grid,.duo{grid-template-columns:1fr} .goals{grid-template-columns:1fr} }
@media (max-width:640px){ .pcols{grid-template-columns:1fr} .pcol + .pcol{border-left:0; border-top:2px solid #E3E5EF} .decl li{flex-direction:column; gap:0} }


/* ═══ Mission 2 ═══ */
.dash{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:20px; align-items:start}
.dash .front-wrap{padding:12px}
.need{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:18px 0}
.need > div{padding:18px; border-radius:var(--r); text-align:center}
.need .ni{font-size:40px}
.need b{display:block; font-family:var(--serif); font-size:19px; color:#fff; margin:6px 0 4px}
.need p{color:var(--soft); font-size:15px}
.need .done{border-color:rgba(52,211,153,.6); box-shadow:0 0 24px rgba(52,211,153,.18)}
.rules{display:grid; gap:10px; margin:14px 0}
.rule{display:flex; gap:14px; align-items:center; padding:14px 18px; border-radius:var(--r)}
.rule .ri{font-size:28px}
.bankpill{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-weight:700; padding:7px 16px; border-radius:999px; background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.45); color:#9ff0c9}
.achat-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.offres{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:stretch}
.offre{background:#fff; color:#1D1F33; border-radius:14px; padding:18px 18px 16px; box-shadow:0 18px 44px rgba(0,0,0,.45); display:flex; flex-direction:column; gap:8px; position:relative; border:3px solid transparent; cursor:pointer; text-align:left; transition:transform .25s}
.offre:hover{transform:translateY(-4px)}
.offre.on{border-color:#E935C5; box-shadow:0 0 0 4px rgba(233,53,197,.35), 0 18px 44px rgba(0,0,0,.45)}
.offre.on::after{content:"✓ Mon choix"; position:absolute; top:-12px; right:12px; background:var(--grad); color:#fff; font-weight:700; font-size:13px; padding:4px 12px; border-radius:999px}
.offre .oh{border-bottom:2px solid #E3E5EF; padding-bottom:8px}
.offre .oh b{font-size:18px}
.offre .oh small{display:block; color:#6B6F88; font-size:12px; line-height:1.35}
.offre .ot{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#6B6F88; font-weight:700}
.offre .art{font-weight:700; font-size:16px}
.offre .det{font-size:13.5px; color:#4A4E68}
.offre .lines{font-size:14px; border-top:1px dashed #E3E5EF; padding-top:6px}
.offre .ln{display:flex; justify-content:space-between; gap:8px; padding:2px 0}
.offre .ln span:last-child{font-family:var(--mono); font-weight:700; white-space:nowrap}
.offre .ln.neg span:last-child{color:#1E8E4E}
.offre .tot{display:flex; justify-content:space-between; background:#F4F2FB; border-radius:8px; padding:8px 10px; font-weight:800}
.offre .tot span:last-child{font-family:var(--mono)}
.offre .cond{font-size:13px; color:#4A4E68; display:grid; gap:2px}
.offre .cond b{color:#1D1F33}
.offre .atout{align-self:flex-start; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:#F1E9FF; color:#6B2FB3}
.offre .valid{font-size:11.5px; color:#8A8FA8}
.compare{margin-top:18px; padding:16px 18px; border-radius:var(--r)}
table.cmp{width:100%; border-collapse:collapse; font-size:15px}
table.cmp th, table.cmp td{padding:8px 10px; border-bottom:1px solid var(--border-soft); text-align:left}
table.cmp th{color:var(--dim); font-size:12px; letter-spacing:.06em; text-transform:uppercase}
table.cmp td.best{color:var(--emerald); font-weight:700}
.after{margin-top:16px; padding:14px 18px; border-radius:var(--r); display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.after b{font-family:var(--mono)}
.after .warnx{color:#ffc4d4}
.paper.bc .note{font-size:13px; color:#6B6F88}
.verif{display:grid; gap:8px; margin-top:16px}
.verif label{display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:14px; background:var(--glass); border:1px solid var(--border); cursor:pointer; font-size:16px}
.verif input{width:22px; height:22px; accent-color:#E935C5}
.sigrow{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px}
.sigrow input{flex:1; min-width:240px; background:#FFFBEA; color:#2A2F7A; border:0; border-bottom:2px dashed #8A8FB0; border-radius:10px 10px 0 0; font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:24px; padding:6px 12px}
.sigrow input:focus{outline:none; border-bottom-style:solid}
/* téléphone */
.phone{width:290px; margin:0 auto; background:#0d0b18; border-radius:36px; padding:16px 14px 24px; border:3px solid #3b3552; box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 0 2px #1d1a2e; position:relative}
.phone::before{content:''; display:block; width:90px; height:20px; border-radius:12px; background:#1d1a2e; margin:0 auto 14px}
.phone .clock{text-align:center; font-family:var(--mono); font-size:38px; color:#fff}
.phone .date{text-align:center; color:var(--dim); font-size:13px; margin-bottom:16px}
.notif{background:rgba(255,255,255,.95); color:#1D1F33; border-radius:16px; padding:12px 14px; font-size:14px; animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.notif + .notif{margin-top:10px; animation-delay:1.2s}
.notif .nh{display:flex; justify-content:space-between; font-size:12px; color:#6B6F88; margin-bottom:4px}
.notif b{display:block; margin-bottom:2px}
@keyframes pop{from{opacity:0; transform:translateY(-14px) scale(.9)} to{opacity:1; transform:none}}
.buzz{animation:buzz .5s 2}
@keyframes buzz{25%{transform:translateX(-3px) rotate(-1deg)} 75%{transform:translateX(3px) rotate(1deg)}}
.duo2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:center}
/* livraison */
.road2{position:relative; height:120px; border-radius:var(--r); overflow:hidden; background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02)); border:1px solid var(--border); margin-bottom:18px}
.road2::after{content:''; position:absolute; left:0; right:0; bottom:26px; border-top:4px dashed rgba(255,255,255,.25)}
.truck{position:absolute; bottom:30px; font-size:62px; animation:drive 2.6s cubic-bezier(.2,.8,.3,1) both}
@keyframes drive{from{left:-90px} to{left:calc(100% - 210px)}}
.house{position:absolute; right:24px; bottom:28px; font-size:58px}
/* paiement */
.terminal{width:280px; margin:0 auto; background:linear-gradient(160deg,#2b2f3a,#16181f); border-radius:28px; padding:18px; box-shadow:0 24px 60px rgba(0,0,0,.55); border:2px solid #444a5a}
.terminal .scr{background:#cfe9d6; color:#0f2a18; border-radius:12px; padding:16px; font-family:var(--mono); text-align:center; min-height:120px; display:flex; flex-direction:column; justify-content:center; gap:6px}
.terminal .scr .amt{font-size:28px; font-weight:700}
.terminal .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.terminal .keys span{background:#3a3f4d; color:#fff; border-radius:8px; text-align:center; padding:8px 0; font-family:var(--mono)}
.receipt{max-width:300px; margin:0 auto; background:#fff; color:#1D1F33; font-family:var(--mono); font-size:13px; padding:16px 18px; box-shadow:0 18px 40px rgba(0,0,0,.45); border-radius:6px 6px 0 0; position:relative}
.receipt::after{content:''; position:absolute; left:0; right:0; bottom:-10px; height:10px; background:radial-gradient(circle at 6px 0,transparent 6px,#fff 6px) repeat-x; background-size:12px 10px}
.receipt .c{text-align:center}
.receipt hr{border:0; border-top:1px dashed #999; margin:8px 0}
.receipt .r{display:flex; justify-content:space-between}
/* patrimoine avant/après */
.ba{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:14px; align-items:center}
.ba .arrow{font-size:40px; color:var(--yellow); text-align:center}
.patri .pl.new{background:#EFFAF3; animation:pop .6s .4s both}
.patri .pl.chg span:last-child{color:#B45309}
.explain{margin-top:18px; padding:16px 20px; border-radius:var(--r); border:1px solid rgba(52,211,153,.45); background:rgba(52,211,153,.07)}
.explain b{color:#9ff0c9}
.equip{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
.equip span{font-size:14px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--border)}
.overlay{position:fixed; inset:0; z-index:80; background:rgba(10,6,24,.86); display:grid; place-items:center; text-align:center}
.overlay .big{font-size:76px; display:flex; gap:24px; justify-content:center}
.overlay .big span{animation:hop 1s ease-in-out infinite}
.overlay .big span:nth-child(2){animation-delay:.2s} .overlay .big span:nth-child(3){animation-delay:.4s}
@keyframes hop{50%{transform:translateY(-18px)}}
.overlay p{font-family:var(--serif); font-size:26px; color:#fff; margin-top:18px}
@media (max-width:1000px){ .dash,.duo2,.ba{grid-template-columns:1fr} .offres{grid-template-columns:1fr} .need{grid-template-columns:1fr} .ba .arrow{transform:rotate(90deg)} }


/* ═══ Patrimoine présenté comme un bilan ═══ */
.patri .pcol{display:flex; flex-direction:column}
.patri .psub{font-size:12px; font-weight:700; color:#8A5BD0; margin:8px 0 2px; text-transform:none; letter-spacing:0}
.patri .pl.vide span{color:#9A9DB4; font-style:italic}
.patri .ptot2{margin-top:auto; padding-top:8px; display:flex; justify-content:space-between; gap:10px; font-weight:800; font-size:16px; border-top:2px solid #1D1F33}
.patri .ptot2 span:last-child{font-family:var(--mono); white-space:nowrap}
.patri .ptot{font-size:15px; gap:12px}
.patri .ptot span:last-child{white-space:nowrap}


/* ═══ Mission 3 ═══ */
.mail{background:#fff; color:#1D1F33; border-radius:12px; overflow:hidden; box-shadow:0 22px 60px rgba(0,0,0,.5); font-size:15px}
.mail .mh{background:#F0F2FA; padding:12px 18px; font-size:13.5px; display:grid; gap:3px; border-bottom:1px solid #E3E5EF}
.mail .mh b{display:inline-block; width:58px; color:#6B6F88; font-weight:600}
.mail .mb{padding:16px 20px; line-height:1.55}
.mail .mb p{margin-bottom:8px}
.paper td:last-child,.paper th:last-child{white-space:nowrap}
.docs3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; align-items:start}
.docs3 .paper{padding:16px 18px; font-size:12.5px}
.docs3 .paper h3.doc{font-size:16px}
.docs3 .paper .from .co{font-size:15px}
.docs3 .paper .from .emb{width:34px; height:34px; font-size:17px}
.docs3 .paper th,.docs3 .paper td{padding:5px 6px; font-size:12px}
.docs3 .paper .to{min-width:0; font-size:12px; padding:8px 10px}
.doclab{font-size:13px; font-weight:700; color:var(--yellow); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em}
.stamp-paid{display:inline-block; transform:rotate(-8deg); border:3px solid #2E9E5B; color:#2E9E5B; font-weight:800; font-size:18px; padding:2px 12px; border-radius:8px; letter-spacing:2px}
.okcards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px}
.okcard{display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:14px; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.4)}
.tvabox{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:stretch}
.tvabox .big{font-family:var(--mono); font-size:30px; color:#fff}
.tvacol{padding:18px 20px; border-radius:var(--r)}
.tvacol > b{font-family:var(--serif); font-size:20px; color:#fff; display:block; margin-bottom:6px}
.tvacol p{margin-bottom:6px}
.binder-zone{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:22px; align-items:center}
.dossiers{display:grid; gap:12px}
.dos{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:16px; background:#fff; color:#1D1F33; box-shadow:0 10px 26px rgba(0,0,0,.35); transition:transform .5s, opacity .5s}
.dos .pile{position:relative; width:46px; height:54px; flex:none}
.dos .pile i{position:absolute; inset:0; background:#F4F2FB; border:1px solid #C9CCDB; border-radius:4px}
.dos .pile i:nth-child(2){transform:translate(4px,4px); background:#EDEFF7} .dos .pile i:nth-child(3){transform:translate(8px,8px); background:#fff}
.dos .pile b{position:absolute; left:14px; top:12px; font-size:22px; z-index:2}
.dos .t{flex:1; font-size:14px} .dos .t b{display:block; font-size:15px}
.dos.classe{opacity:.35; transform:translateX(30px) scale(.96)}
.binder{position:relative; height:300px; border-radius:18px; background:linear-gradient(160deg,#3E63DD,#1E2A5A); box-shadow:0 20px 50px rgba(0,0,0,.5), inset -14px 0 0 rgba(0,0,0,.18); display:grid; place-items:center; text-align:center; color:#fff; padding:18px}
.binder::before{content:''; position:absolute; left:16px; top:20px; bottom:20px; width:10px; border-radius:5px; background:repeating-linear-gradient(180deg,#d9dde8 0 14px,transparent 14px 40px)}
.binder .lab{background:#fff; color:#1D1F33; border-radius:10px; padding:14px 12px; font-family:var(--serif); font-size:19px; line-height:1.2; box-shadow:0 6px 16px rgba(0,0,0,.3)}
.binder .lab small{display:block; font-family:var(--ui); font-size:12px; color:#6B6F88; margin-top:4px}
.binder .count{position:absolute; bottom:16px; left:0; right:0; font-family:var(--mono); font-size:15px}
.binder.pulse{animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.05)}}
.flydoc{position:fixed; z-index:90; font-size:42px; pointer-events:none; transition:all .8s cubic-bezier(.5,0,.3,1)}
.keep{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:18px}
.keep > div{padding:16px; border-radius:var(--r)}
.keep .ki{font-size:30px}
.keep > div > b{display:block; color:#fff; font-family:var(--serif); font-size:18px; margin:4px 0}
.keep p{color:var(--soft); font-size:14.5px}
.party{position:relative; padding:28px 30px; border-radius:var(--r-lg); background:linear-gradient(135deg,rgba(255,61,139,.25),rgba(157,78,221,.25),rgba(34,211,238,.2)); border:1px solid rgba(255,255,255,.25); overflow:hidden}
.party .burst{font-size:64px; text-align:center; animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px) rotate(-4deg)}}
.party h2{font-family:var(--serif); text-align:center; font-size:clamp(30px,3vw,44px); color:#fff; margin:6px 0 4px}
.client-card{display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:start; margin-top:18px}
.client-card .av2{width:84px; height:84px; border-radius:50%; display:grid; place-items:center; font-size:44px; background:#fff; box-shadow:0 0 0 5px rgba(255,255,255,.35)}
.bubble{background:#fff; color:#1D1F33; border-radius:4px 18px 18px 18px; padding:16px 20px; font-size:16px; line-height:1.5; box-shadow:0 14px 34px rgba(0,0,0,.35)}
.bubble .mh{font-size:12.5px; color:#6B6F88; margin-bottom:6px}
.ordertab{width:100%; border-collapse:collapse; margin-top:10px; font-size:15px}
.ordertab th{background:#F0F2FA; text-align:left; padding:6px 8px; font-size:12.5px}
.ordertab td{padding:6px 8px; border-bottom:1px solid #E3E5EF}
.browser{background:#fff; color:#1D1F33; border-radius:14px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.5)}
.browser .bar{display:flex; align-items:center; gap:8px; background:#E9EBF2; padding:9px 12px}
.browser .bar i{width:11px; height:11px; border-radius:50%; background:#FF5F57} .browser .bar i:nth-child(2){background:#FEBC2E} .browser .bar i:nth-child(3){background:#28C840}
.browser .url{flex:1; background:#fff; border-radius:8px; padding:5px 12px; font-family:var(--mono); font-size:12.5px; color:#4A4E68}
.browser .shophead{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 18px; background:#1E2A5A; color:#fff}
.browser .shophead b{font-size:19px}
.browser .shophead small{font-size:12.5px; opacity:.85}
.browser .shopbody{padding:16px 18px; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:16px}
.prods{display:grid; gap:10px}
.prod{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 14px; border:2px solid #E3E5EF; border-radius:12px; cursor:pointer; background:#fff; text-align:left; color:#1D1F33; font:inherit}
.prod:hover{border-color:#9AA3C7}
.prod.on{border-color:#E935C5; background:#FFF4FC}
.prod b{font-size:15px} .prod small{display:block; color:#6B6F88; font-size:12.5px}
.prod .px{text-align:right; font-family:var(--mono); font-size:13px; white-space:nowrap}
.prod .px b{font-size:15px; display:block}
.cart{border:1px solid #E3E5EF; border-radius:12px; padding:12px 14px; font-size:14px; display:grid; gap:4px; align-content:start}
.cart h4{font-size:15px; margin-bottom:4px}
.cart .ln{display:flex; justify-content:space-between; gap:8px}
.cart .ln span:last-child{font-family:var(--mono); white-space:nowrap}
.cart .ln.tot{border-top:2px solid #1D1F33; padding-top:6px; margin-top:4px; font-weight:800; font-size:15.5px}
.cart .qty{display:flex; gap:8px; align-items:center; margin:6px 0}
.cart .qty input{width:90px; font:inherit; font-size:18px; font-family:var(--mono); padding:6px 10px; border:2px solid #C9CCDB; border-radius:10px; text-align:center}
.cart .qty input:focus{outline:none; border-color:#E935C5}
.condbox{margin-top:10px; border-radius:12px; background:#F4F6FC; padding:10px 12px; font-size:13px; display:grid; gap:3px}
.condbox b{font-size:13.5px}
.warnline{font-size:13.5px; color:#B42357; font-weight:600}
.okline{font-size:13.5px; color:#1E8E4E; font-weight:600}
.mailconf{margin-top:16px}
.resu{max-width:760px; margin:0 auto; background:#fff; color:#1D1F33; border-radius:18px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.45)}
.resu h4{background:linear-gradient(120deg,#FF8A3D,#E935C5); color:#fff; padding:12px 20px; font-size:18px}
.resu .cols{display:grid; grid-template-columns:1fr 1fr}
.resu .col{padding:14px 20px; display:flex; flex-direction:column}
.resu .col + .col{border-left:2px solid #E3E5EF}
.resu h5{font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:#6B6F88; margin-bottom:8px}
.resu .pl{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed #E3E5EF; font-size:16px}
.resu .pl span:last-child{font-family:var(--mono); font-weight:700; white-space:nowrap}
.resu .pl.ben{background:#EFFAF3; color:#1E7A45; font-weight:800}
.resu .tot{margin-top:auto; padding-top:8px; display:flex; justify-content:space-between; font-weight:800; border-top:2px solid #1D1F33}
.resu .tot span:last-child{font-family:var(--mono)}
.resu .eq{background:#F4F2FB; padding:10px 20px; font-weight:700; text-align:center}
.patri .pl.gain{background:#EFFAF3; color:#1E7A45; font-weight:700}
.stars{font-size:26px; letter-spacing:4px}
@media (max-width:1000px){ .docs3,.tvabox,.binder-zone,.keep,.okcards{grid-template-columns:1fr} .browser .shopbody{grid-template-columns:1fr} }


/* ═══ Prix de vente (mission 3) ═══ */
.pv-strat{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:18px; align-items:center; padding:18px 22px; border-radius:var(--r); margin-bottom:18px}
.pv-ico{font-size:44px}
.pv-strat small{display:block; color:var(--dim); font-size:13px}
.pv-strat b{display:block; font-family:var(--serif); font-size:24px; color:#fff}
.pv-strat span{color:var(--soft); font-size:15px}
.pv-marge{text-align:center; padding:10px 18px; border-radius:16px; background:linear-gradient(120deg,rgba(255,61,139,.22),rgba(157,78,221,.22)); border:1px solid rgba(233,53,197,.45)}
.pv-marge b{font-size:18px} .pv-marge span{display:block; font-family:var(--mono); font-size:30px; font-weight:700; color:#fff}
.pv-grid{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:18px; align-items:start}
.pv-calc,.pv-cmp{padding:20px 22px; border-radius:var(--r)}
.pv-step{display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid var(--border); margin-bottom:10px}
.pv-step b{display:block; color:#fff; font-size:16px}
.pv-step small{display:block; color:var(--soft); font-size:14px; margin-top:2px}
.pv-step small i{color:var(--dim)}
.pv-n{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-weight:700; background:var(--glass-hover); color:var(--yellow)}
.pv-res{font-family:var(--mono); font-weight:700; font-size:18px; color:#fff; white-space:nowrap}
.pv-step.fort{border-color:rgba(52,211,153,.6); background:rgba(52,211,153,.1)}
.pv-step.fort .pv-res{color:#9ff0c9; font-size:22px}
.pv-total{margin-top:6px; padding:12px 14px; border-radius:14px; background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.45); font-size:16px}
.pv-total b{font-family:var(--mono)}
.pv-cmp tr.moi td{background:rgba(233,53,197,.14); color:#fff; font-weight:700}
.pv-cmp td small{color:var(--dim); font-weight:400}
.pv-cmp td:not(:first-child){font-family:var(--mono); white-space:nowrap}
@media (max-width:1000px){ .pv-grid{grid-template-columns:1fr} .pv-strat{grid-template-columns:auto 1fr} .pv-marge{grid-column:1/-1} }
/* Documents : l'adresse du destinataire ne sort jamais de la feuille */
.paper .dh{flex-wrap:wrap}
.paper .from{min-width:0; flex:1 1 240px}
.paper .to{min-width:0 !important; flex:0 1 260px; max-width:100%; overflow-wrap:anywhere}
.paper td:nth-last-child(-n+2){white-space:nowrap}

#print-area{display:none}
@media print{
  body{background:#fff}
  body > *:not(#print-area){display:none !important}
  body::after{display:none}
  #print-area{display:block}
  #print-area .idcard,#print-area .patri,#print-area .biz{box-shadow:none; margin:0 0 10mm}
  #print-area .front-wrap{background:#fff; max-width:160mm}
}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  aside{position:static; order:-1}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .road{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .g2,.row,.row3,.stats,.road{grid-template-columns:1fr}
  .paper{padding:24px 18px}
  .paper .dh{flex-direction:column}
  .idgrid{grid-template-columns:1fr}
  .blob{filter:blur(60px); width:340px !important; height:340px !important}
  .who{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .stamp{opacity:.9}
}

function factureDepuisAchat(x, k){
  const o = x.offreChoisie, total = x.paiement.montant;
  const taxable = r2(total / 1.21), tva = r2(total - taxable);
  let pHT = r2(o.prix / 1.21), remHT = 0, portHT = 0;
  if (o.fraisLivraison > 0){ remHT = o.remise ? r2(pHT * o.remisePourcent / 100) : 0; portHT = r2(taxable - (pHT - remHT)); }
  else if (o.remise){ remHT = r2(pHT - taxable); }
  else pHT = taxable;
  const code = (o.numero || "OP-XXX").split("-")[1] || "FRN";
  return { numero:`FA-${code}-${String(hash((S.eleve.email || "") + o.reference) % 9000 + 1000)}`, date:x.paiement.date || x.bonDeLivraison.date,
    fournisseur:o.fournisseur, reference:o.reference, article:o.article, detail:o.detail, pHT, remPct:o.remisePourcent || 0, remHT, portHT, taxable, tva, total,
    bc:x.bonDeCommande, bl:x.bonDeLivraison, bienId:x.bien.id };
}
function lireM2(dossier){
  const m = dossier.missions && dossier.missions["2"] || {}, e = dossier.entreprise || {}, achats = (m.achats || []).filter(a => a.paiement && a.offreChoisie);
  const ordre = ["mobilier","caisse","ordinateur"];
  const materiel = achats.slice().sort((a,b) => ordre.indexOf(a.bien.id) - ordre.indexOf(b.bien.id)).map(a => { const b = bien(a.bien.id);
    return { libelle:`${b.nom.replace(/^(Le |La |L')/, "").replace(/^./, c => c.toUpperCase())} (${a.offreChoisie.fournisseur.nom})`, montant:a.paiement.montant, icone:b.icone, type:"materiel" }; });
  const paye = materiel.reduce((s,x) => s + x.montant, 0);
  const banque = e.patrimoine && e.patrimoine.argentEnBanque != null ? e.patrimoine.argentEnBanque : r2(M1.banqueDepart - paye);
  return { materiel, banque, factures: achats.map(factureDepuisAchat) };
}

const march = () => MARCH[M1.typeId];

/** Calcul de la commande comme sur le site du fournisseur (prix hors TVA, puis TVA 21 %). */
function calculCommande(art, q){
  const brut = r2(q * art.prixHT), remise = q >= CONDITIONS.remiseDes ? r2(brut * CONDITIONS.remisePct / 100) : 0, net = r2(brut - remise);
  const port = net >= CONDITIONS.francoDes || q === 0 ? 0 : CONDITIONS.port, taxable = r2(net + port), tva = r2(taxable * CONDITIONS.tva / 100), total = r2(taxable + tva);
  return { q, brut, remise, net, port, taxable, tva, total };
}
const achatMarch = () => calculCommande(articleClient(), articleClient().qte);
/** Le prix de vente se construit à partir du prix d'achat d'un article et de la marge liée à la stratégie. */

function jsonp(params, timeout = 40000){
  return new Promise((resolve, reject) => {
    const cb = "cbJ" + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement("script");
    let fini = false;
    // Une réponse qui arrive en retard ne provoque plus d'erreur : la fonction reste définie (vide) un moment.
    const fin = () => { fini = true; clearTimeout(t); s.remove(); window[cb] = function(){}; setTimeout(() => { try { delete window[cb]; } catch(e) {} }, 120000); };
    const t = setTimeout(() => { if (!fini){ fin(); reject(new Error("timeout")); } }, timeout);
    window[cb] = (d) => { if (fini) return; fin(); resolve(d); };
    s.onerror = () => { if (!fini){ fin(); reject(new Error("reseau")); } };
    s.src = CONFIG.ENDPOINT_URL + "?" + new URLSearchParams(Object.assign({}, params, {callback:cb, _:Date.now()})).toString();
    document.body.appendChild(s);
  });
}
function envoyer(statut){

}

// ======================================================================
//  SAUVEGARDES ESPACÉES : une classe entière ne doit pas saturer Google
//  (au plus un envoi « en_cours » toutes les 30 s par élève, sauf étape importante ;
//   l'état le plus récent part toujours, avec un petit décalage aléatoire)
// ======================================================================
let DERNIERE_SAUVEGARDE = 0, SAUVEGARDE_PREVUE = null, DERNIER_PING = 0;
const PAUSE_SAUVEGARDE = 30000, PAUSE_PING = 60000;
function sauvegarder(force){
  const ecoule = Date.now() - DERNIERE_SAUVEGARDE;
  if (force || ecoule >= PAUSE_SAUVEGARDE){
    annulerSauvegardePrevue(); DERNIERE_SAUVEGARDE = Date.now(); envoyer("en_cours"); return;
  }
  if (!SAUVEGARDE_PREVUE) SAUVEGARDE_PREVUE = setTimeout(() => {
    SAUVEGARDE_PREVUE = null;
    if (["etapes","accueil"].includes(MODE)){ DERNIERE_SAUVEGARDE = Date.now(); envoyer("en_cours"); }
  }, PAUSE_SAUVEGARDE - ecoule + Math.random() * 8000);
}
function annulerSauvegardePrevue(){ clearTimeout(SAUVEGARDE_PREVUE); SAUVEGARDE_PREVUE = null; }
const pingAutorise = () => { if (Date.now() - DERNIER_PING < PAUSE_PING) return false; DERNIER_PING = Date.now(); return true; };
// Si l'élève ferme la page avec une sauvegarde en attente, on l'envoie quand même.
window.addEventListener("pagehide", () => {
  if (SAUVEGARDE_PREVUE && ["etapes","accueil"].includes(MODE) && navigator.sendBeacon){
    try { navigator.sendBeacon(CONFIG.ENDPOINT_URL, new Blob([JSON.stringify(payload("en_cours"))], {type:"text/plain;charset=utf-8"})); } catch(e) {}
  }
});

function restaurer(etat){
  const s = fresh();
  if (etat && etat.v === "m3-1") Object.keys(s).forEach(k => { if (etat[k] !== undefined && etat[k] !== null) s[k] = etat[k]; });
  return s;
}

  const box = $("#toasts"), t = document.createElement("div"); t.className = "toast " + cls; t.innerHTML = html;
  box.appendChild(t); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => t.remove(), 3500);
}

  S.done["b_" + id] = true; setTimeout(() => toast(`<div>${b[1]} Badge débloqué : ${esc(b[2])}</div>`), 400);

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#ff3d8b","#e935c5","#9d4edd","#22d3ee","#a3e635","#fbbf24","#fb923c", M1 ? M1.couleur : "#fff"];
  for (let i=0;i<80;i++){
    const c = document.createElement("div"); c.className = "confetti";
    c.style.left = Math.random()*100 + "vw"; c.style.background = cols[i % cols.length];
    c.style.animationDuration = (2 + Math.random()*2) + "s"; c.style.animationDelay = (Math.random()*.6) + "s";
    if (i % 3 === 0) c.style.borderRadius = "50%";
    document.body.appendChild(c); setTimeout(() => c.remove(), 4800);
  }
}

function docsAchat(x){

    ${signe(x.bc.signature, "Bon pour commande")}</div>`;
  const bl = `<div class="paper"><div class="dh">${enteteF(x.fournisseur)}</div><h3 class="doc">BON DE LIVRAISON</h3><div class="ref">N° ${esc(x.bl.numero)} – ${esc(x.bl.date)}<br>Votre commande ${esc(x.bc.numero)}</div>

const ERREURS = {
  email_invalide:"Cette adresse n'est pas valide. Elle doit ressembler à prenom.nom@istlm.org.",
  non_inscrit:"Cette adresse n'est pas sur la liste de ta classe. Vérifie l'orthographe ou demande à ton professeur.",
  reseau:"Impossible de joindre le serveur. Vérifie ta connexion internet puis réessaie.",
  timeout:"Le serveur Google ne répond pas pour l'instant. Patiente quelques secondes, puis clique à nouveau."
};
async function seConnecter(email){
  LOGIN.busy = true; LOGIN.err = ""; LOGIN.lent = false; render();
  SESSION.email = email;
  const lent = setTimeout(() => { if (LOGIN.busy){ LOGIN.lent = true; render(); } }, 6000);
  let r;
  try { r = await connexion(); } catch(e) { clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false; LOGIN.err = e.message === "timeout" ? ERREURS.timeout : ERREURS.reseau; MODE = "login"; render(); return; }
  clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false;
  if (!r || !r.ok){ LOGIN.err = ERREURS[r && r.erreur] || "Connexion refusée. Demande à ton professeur."; MODE = "login"; render(); return; }
  appliquerConnexion(r, email);
}
function identite(email, ...sources){
  const id = Object.assign({email}, nomDepuisEmail(email), {classe:CONFIG.CLASSE_DEFAUT});
  sources.forEach(s => { if (s) ["prenom","nom","classe"].forEach(k => { if (s[k] && String(s[k]).trim()) id[k] = String(s[k]).trim(); }); });
  id.email = email; return id;
}
function appliquerConnexion(r, email){
  SESSION.diag = r.diagnostic || null;
  const d = r.dossier, ms = d && d.missions ? d.missions : {};
  S.eleve = identite(email, d && d.eleve, r.eleve);
  if (!ms["1"] || ms["1"].statut !== "termine"){ SESSION.bloque = "m1"; MODE = "bloque"; render(true); return; }
  if (!ms["2"] || ms["2"].statut !== "termine"){ SESSION.bloque = "m2"; MODE = "bloque"; render(true); return; }
  M1 = lireM1(d); M2 = lireM2(d);
  if (!MARCH[M1.typeId] || !M2.factures.length){ SESSION.bloque = "m2"; MODE = "bloque"; render(true); return; }

    <button id="tGo" style="font:inherit;padding:4px 12px;border-radius:8px;border:0;background:#1D1F33;color:#fff;cursor:pointer">Recommencer</button>`;
  document.body.appendChild(b);
  const relancer = () => { location.search = `?test&activite=${$("#tAct").value}&strategie=${$("#tStr").value}`; };
  $("#tAct").addEventListener("change", relancer); $("#tStr").addEventListener("change", relancer); $("#tGo").addEventListener("click", relancer);
  LOGIN.email = EMAIL; seConnecter(EMAIL);
})();
</script>
