  background:linear-gradient(180deg, transparent 62%, rgba(255,226,120,.38) 62%); border-bottom:2px dotted #8f96ad}
.paper .sigline input::placeholder{font:500 15px var(--doc); color:#6b7186}
.paper .sigline input:disabled{-webkit-text-fill-color:var(--encre-bleue); opacity:1}
.paper .sigline div{flex:0 1 260px; min-width:196px}
.m3-recu{margin-right:auto; font-size:18px}
.m3-recu.m3-attente{opacity:0}
#main .paper.agrafe::before{opacity:1; mix-blend-mode:normal; right:auto; bottom:auto; top:5px; left:12px; transform:rotate(-14deg)}
#main .paper{overflow-x:auto}                     /* un tableau trop large défile dans sa feuille au lieu d'être coupé (écrans moyens) */

/* ─── Briefing : la boutique et le calendrier du premier mois ─── */
.m3-ouverture{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:26px; align-items:center; margin:2px 0 28px; max-width:960px}
.m3-ouv-vitrine{border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--line2); box-shadow:0 26px 60px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.03)}
.m3-ouv-vitrine svg{display:block; width:100%; height:auto}
.m3-calendrier{position:relative; padding:28px 18px 16px; border-radius:10px; background:#fffdf6; color:var(--m3-encre); font-family:var(--doc); box-shadow:var(--ombre-papier); transform:rotate(1.2deg)}
.m3-calendrier::before{content:""; position:absolute; left:0; right:0; top:0; height:15px; border-radius:10px 10px 0 0; background:linear-gradient(90deg,var(--pink),var(--violet))}
.m3-cal-anneaux{position:absolute; top:-10px; left:0; right:0; display:flex; justify-content:space-around; padding:0 30px}
.m3-cal-anneaux i{width:9px; height:24px; border-radius:6px; background:linear-gradient(90deg,#7f8696,#eef0f4 45%,#7f8696); box-shadow:0 2px 3px rgba(0,0,0,.45)}
.m3-cal-tete{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; padding-bottom:7px; border-bottom:2px solid var(--m3-marine)}
.m3-cal-tete b{font:800 15px var(--doc); letter-spacing:.07em; text-transform:uppercase; color:var(--m3-marine)}
.m3-cal-tete small{font:600 12px var(--doc); color:var(--m3-encre-douce); text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m3-cal-grille{display:grid; grid-template-columns:28px repeat(7,minmax(0,1fr)); gap:4px; align-items:center}
.m3-cal-j{font:700 10px var(--doc); color:var(--m3-encre-douce); text-align:center}
.m3-cal-n{font:700 11px var(--mono); color:var(--m3-marine)}
.m3-cal-case{height:25px; border-radius:5px; background:#f1ece0; display:grid; place-items:center; font-size:14px; line-height:1}
.m3-cal-case.m3-cal-we{background:#e6dfcd}
.m3-cal-case.m3-cal-evt{background:#ffe7a1; box-shadow:inset 0 0 0 1.5px #d9a63a}
.m3-cal-legende{list-style:none; margin-top:12px; display:grid; gap:5px; font:500 12.5px/1.35 var(--doc); color:var(--m3-encre)}
.m3-cal-legende b{font:700 11.5px var(--mono); color:var(--m3-rose); margin-right:5px}
.m3-cal-fin{margin-top:9px; padding-top:8px; border-top:1px dashed #c8c0ad; font:700 12.5px var(--doc); color:var(--m3-marine)}

/* ─── Stock : la réserve, ses étagères et ses cartons ─── */
.m3-reserve{position:relative; margin:0 0 16px; padding:14px 18px 0; border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--line);
  background:radial-gradient(60% 120% at 50% -20%, rgba(255,214,140,.22), transparent 60%), linear-gradient(180deg,#2a2342,#1c1730)}
.m3-reserve::before{content:""; position:absolute; left:50%; top:0; width:2px; height:12px; background:#0e0b18}
.m3-reserve::after{content:""; position:absolute; left:50%; top:10px; width:34px; height:9px; margin-left:-16px; border-radius:0 0 17px 17px; background:#3a3352; box-shadow:0 6px 18px 4px rgba(255,214,140,.35)}
.m3-reserve-plaque{position:absolute; top:12px; left:16px; z-index:1; padding:4px 10px; border-radius:4px; background:var(--cpt-or); color:#2b1d02; font:800 11px var(--doc); letter-spacing:.18em; text-transform:uppercase; box-shadow:0 2px 0 var(--cpt-or-fonce)}
.m3-reserve{background-image:radial-gradient(60% 120% at 50% -20%, rgba(255,214,140,.22), transparent 60%), repeating-linear-gradient(180deg, transparent 0 17px, rgba(255,255,255,.035) 17px 18px), linear-gradient(180deg,#2a2342,#1c1730)}
.m3-reserve-rayon{position:relative; display:flex; justify-content:center; align-items:flex-end; gap:24px; padding:30px 8px 0; min-height:128px; border-bottom:12px solid #6b4426; box-shadow:0 7px 0 #3d2615; margin:0 -18px; padding-left:26px; padding-right:26px}
.m3-reserve-rayon::before,.m3-reserve-rayon::after{content:""; position:absolute; bottom:-19px; width:9px; height:150px; border-radius:2px; background:linear-gradient(90deg,#4b525d,#a4acb7 45%,#4b525d);
  box-shadow:0 0 0 1px rgba(0,0,0,.25); background-size:auto}
.m3-reserve-rayon::before{left:34px} .m3-reserve-rayon::after{right:34px}
.m3-carton{position:relative; flex:0 1 132px; min-width:0; height:88px; border-radius:4px; color:#2b1d0e; box-shadow:inset 0 -6px 10px rgba(0,0,0,.16), 0 8px 14px rgba(0,0,0,.45)}
.m3-carton-scotch{position:absolute; left:50%; top:0; bottom:0; width:22px; margin-left:-11px; background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.34),rgba(255,255,255,.16))}
.m3-carton-emoji{position:absolute; left:9px; top:8px; font-size:26px; line-height:1}
.m3-carton-etiq{position:absolute; right:7px; bottom:8px; width:66%; max-width:84px; padding:4px 6px; border-radius:2px; background:#fff; color:var(--m3-encre); font:600 9px/1.25 var(--doc); transform:rotate(-2deg); box-shadow:0 1px 2px rgba(0,0,0,.3)}
.m3-carton-etiq b{display:block; font:700 14px/1.15 var(--mono); color:var(--m3-marine); white-space:nowrap}
.m3-carton-etiq small{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.m3-carton.m3-carton-vide{background:transparent; box-shadow:none; border:2px dashed rgba(255,255,255,.4)}
[data-decor] .m3-carton-vide .m3-carton-scotch{display:none}
.m3-carton.m3-carton-vide .m3-carton-emoji{opacity:.55}
.m3-carton.m3-carton-vide .m3-carton-etiq b{font:800 10px/1.2 var(--doc); letter-spacing:.04em; text-transform:uppercase; color:var(--m3-rose); white-space:normal}
#main .art .ai.m3-ai-carton{width:56px; height:56px; padding:0; border-radius:6px; display:grid; place-items:center; font-size:29px; color:#2b1d0e; box-shadow:inset 0 -5px 8px rgba(0,0,0,.18), 0 6px 12px rgba(0,0,0,.35)}

/* ─── Stock : l'aperçu devient le bon de commande au grossiste, sur papier ─── */
#main .card.m3-bon{background:var(--papier) var(--grain); color:var(--m3-encre); border:0; border-top:6px solid var(--brand); border-radius:3px; box-shadow:var(--ombre-papier); -webkit-backdrop-filter:none; backdrop-filter:none}
#main .m3-bon h3{font:700 13px var(--doc); letter-spacing:.08em; text-transform:uppercase; color:var(--m3-encre-douce)}
#main .m3-bon table.led td{color:var(--m3-encre); border-bottom-color:var(--m3-filet)}
#main .m3-bon table.led tr.tot td{border-top-color:var(--m3-marine); background:rgba(20,40,75,.05)}
#main .m3-bon .pos{color:var(--m3-vert)}
#main .m3-bon .help{color:var(--m3-encre-douce)}
.m3-bon-tete{display:flex; justify-content:space-between; align-items:flex-start; gap:8px 14px; flex-wrap:wrap; margin:-6px 0 12px; padding-bottom:10px; border-bottom:2px solid var(--m3-marine); font-family:var(--doc); color:var(--m3-encre)}
.m3-bon-tete b{display:block; font:800 17px var(--doc); letter-spacing:.08em; text-transform:uppercase; color:var(--m3-marine)}
.m3-bon-tete small{display:block; font:600 12.5px var(--doc); color:var(--m3-encre-douce)}
.m3-bon-dest{font:500 11.5px/1.35 var(--doc); color:var(--m3-encre-douce); text-align:right; margin-left:auto}
.m3-bon-dest b{font:700 13px var(--doc); letter-spacing:0; text-transform:none; color:var(--m3-encre)}
.m3-bon-signe{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:2px 14px; margin-top:12px; padding-top:8px; border-top:1px dashed #c8c0ad}
.m3-bon-signe small{font:600 12px var(--doc); color:var(--m3-encre-douce)}
.m3-bon-signe .signed{font-size:32px !important}
.m3-bon-signe .cpt-fictif{flex-basis:100%; text-align:right; margin-top:0}

/* ─── Réception : le camion du grossiste et ses colis ─── */
.kit-route.m3-livraison{height:176px; margin:0 0 18px; border-radius:var(--r-lg); container-type:inline-size}
.m3-livraison .kit-camion{left:44px; width:268px}
.m3-pile{position:absolute; right:196px; bottom:16px; display:grid; grid-template-columns:repeat(2,auto); justify-items:center; align-items:end; gap:0 5px}
.m3-facade{position:absolute; right:0; top:0; width:176px; height:96px; background-color:#7b3726;
  background-image:repeating-linear-gradient(180deg, transparent 0 8px, rgba(236,214,190,.30) 8px 9px), repeating-linear-gradient(90deg, transparent 0 17px, rgba(236,214,190,.18) 17px 18px), linear-gradient(90deg, rgba(0,0,0,.35), transparent 14%);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.m3-facade-nom{position:absolute; left:16px; right:16px; top:9px; padding:4px 6px; border-radius:3px; background:var(--brand); color:var(--on-brand); font:800 11px var(--doc); letter-spacing:.02em; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 0 16px color-mix(in srgb, var(--brand) 65%, transparent), 0 2px 0 rgba(0,0,0,.35)}
.m3-facade-vitre{position:absolute; left:16px; bottom:0; width:72px; height:48px; background:linear-gradient(180deg,#ffe2a6,#f0a854); border:4px solid #2b2340; border-bottom:0; box-shadow:0 0 24px rgba(255,200,120,.55)}
.m3-facade-vitre::after{content:"OUVERT"; position:absolute; left:50%; top:12px; transform:translateX(-50%); padding:1px 4px; border-radius:2px; background:#fff; color:#1f7a45; font:800 7px var(--doc); letter-spacing:.08em}
.m3-facade-porte{position:absolute; right:18px; bottom:0; width:44px; height:62px; background:linear-gradient(180deg,#2c3766,#1a2140); border:4px solid #2b2340; border-bottom:0; border-radius:3px 3px 0 0}
.m3-facade-porte::after{content:""; position:absolute; right:5px; top:30px; width:4px; height:11px; border-radius:2px; background:#e3b85c}
@container (max-width:760px){ [data-decor] .m3-facade{display:none} .m3-pile{right:18px} }
.m3-colis{position:relative; width:104px; height:68px; border-radius:3px; color:#2b1d0e; box-shadow:inset 0 -5px 8px rgba(0,0,0,.16), 0 6px 12px rgba(0,0,0,.45)}
.m3-colis:nth-child(1){grid-row:2; grid-column:1} .m3-colis:nth-child(2){grid-row:2; grid-column:2} .m3-colis:nth-child(3){grid-row:1; grid-column:1 / span 2; transform:rotate(-2deg)}
.m3-colis-scotch{position:absolute; left:0; right:0; top:50%; height:14px; margin-top:-7px; background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.34),rgba(255,255,255,.16))}
.m3-colis-etiq{position:absolute; left:8px; top:6px; width:74px; padding:3px 5px; border-radius:2px; background:#fff; color:var(--m3-encre); font:600 7.5px/1.2 var(--doc); box-shadow:0 1px 2px rgba(0,0,0,.3); transform:rotate(-1.5deg)}
.m3-colis-etiq b{display:block; font:800 8.5px var(--doc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.m3-colis-etiq svg{display:block; width:100%; height:12px; margin:2px 0}
.m3-colis-etiq small{display:block; font:600 7px var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.m3-colis-fragile{position:absolute; right:6px; bottom:6px; padding:1px 5px; border-radius:2px; background:#d93636; color:#fff; font:800 7px var(--doc); letter-spacing:.12em; transform:rotate(-5deg)}

/* ─── Réception : l'écriture comptable dans le journal ─── */
#main .ecriture.cpt-registre{--muted:var(--m3-encre-douce); border:0; padding:16px 16px 14px 54px; border-radius:4px}
#main .ecriture.cpt-registre h4{color:var(--m3-marine)}
#main .ecriture.cpt-registre .help{color:var(--m3-encre-douce)}

/* ─── Prix : le bureau, la calculatrice TerrilCalc et les étiquettes ─── */
.bureau.m3-prix{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:18px 24px; padding:22px 26px; margin:0 0 18px; border-radius:var(--r-lg)}
.m3-etiquettes{display:flex; flex-direction:column; align-items:flex-start; gap:18px; flex:1 1 200px; min-width:0}
.m3-etiquettes-titre{font:800 11px var(--doc); letter-spacing:.16em; text-transform:uppercase; color:#f6d88f; text-shadow:0 1px 2px rgba(0,0,0,.5)}
.m3-etiq{position:relative; padding-left:24px; max-width:100%; transition:transform .2s}
.m3-etiq::before{content:""; position:absolute; left:2px; top:50%; width:24px; height:2px; margin-top:-1px; background:#e9dcc0; transform:rotate(-10deg); transform-origin:left center}
.m3-etiq::after{content:""; position:absolute; left:0; top:50%; width:7px; height:7px; margin-top:-5px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff 0 1px,#c9a24a 2px,#7a5a1c)}
.m3-etiq .cpt-etiquette{font-size:20px}
.m3-etiq .cpt-etiquette small{max-width:210px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.03em; text-transform:none; font-size:11px}
.m3-etiq.actif .cpt-etiquette{background:#ffe9a6}
.m3-etiq.actif{transform:translateX(6px)}
.m3-calc-zone .cpt-calc{display:flex; align-items:center; gap:16px; width:auto; max-width:none; margin:0}
.m3-calc-zone .cpt-ruban{width:224px; margin:0; padding:12px 12px 14px; border-radius:2px; transform:rotate(-2deg); font-size:12px}
.m3-calc-zone .cpt-ruban span{min-width:0; overflow:hidden; text-overflow:ellipsis}
.m3-calc-zone .cpt-ruban div:first-child{font-weight:700; border-bottom:1px dashed #999; padding-bottom:3px; margin-bottom:3px}
.m3-calc-zone .cpt-ruban div:last-child{border-top:1px solid #333; margin-top:3px; padding-top:3px}
.m3-calc-zone .cpt-calc-corps{width:196px; flex:none; padding:12px 12px 14px}
.m3-calc-zone .cpt-ecran{height:46px; font-size:24px}
.m3-calc-zone .cpt-touches{gap:6px; margin-top:10px}
.m3-calc-zone .cpt-touches span{height:27px; font-size:14px}

/* ─── Semaines : le liège des ventes et le ticket de caisse ─── */
.cpt-liege.m3-liege{margin:0 0 18px; padding:20px 24px 26px; container-type:inline-size}
.m3-liege-grille{display:grid; grid-template-columns:minmax(0,1fr) 216px; gap:16px 22px; align-items:start}
.m3-liege-haut{grid-column:1; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.m3-liege-titre{position:relative; padding:6px 14px; background:#fffdf6; color:var(--m3-marine); font:800 13px var(--doc); letter-spacing:.12em; text-transform:uppercase; transform:rotate(-1.5deg); box-shadow:0 6px 12px rgba(0,0,0,.3)}
.m3-promo{display:inline-grid; place-items:center; width:62px; height:62px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ff6b6b,#c62828); color:#fff; font:800 15px/1 var(--doc); text-align:center; transform:rotate(12deg); box-shadow:0 6px 14px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.35)}
.m3-promo small{display:block; font:800 9px var(--doc); letter-spacing:.12em}
.m3-postits{grid-column:1; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px 14px; padding-top:6px}
.m3-liege .cpt-postit{min-height:94px; padding:16px 12px 12px; font-size:23px; line-height:1.1; overflow-wrap:anywhere}
.m3-liege .cpt-postit small{margin:0 0 5px; font-size:11.5px}
.m3-ticket{grid-column:2; grid-row:1 / span 2; position:relative; padding:16px 14px 16px; font:500 11.5px/1.5 var(--mono); transform:rotate(1.6deg)}
.m3-ticket::after{content:""; position:absolute; left:0; right:0; bottom:-7px; height:8px; background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/8px 8px repeat-x, linear-gradient(225deg,#fff 50%,transparent 50%) 0 0/8px 8px repeat-x}
.m3-tk-tete{text-align:center; border-bottom:1px dashed #9a9a9a; padding-bottom:6px; margin-bottom:6px}
.m3-tk-tete b{display:block; font:800 13px var(--doc); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.m3-tk-tete small{display:block; font:600 10px var(--mono); color:#555}
.m3-tk-l{display:flex; justify-content:space-between; gap:8px}
.m3-tk-l span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m3-tk-l b{font-weight:600; white-space:nowrap}
.m3-tk-tot{display:flex; justify-content:space-between; gap:8px; margin-top:6px; padding-top:6px; border-top:1px dashed #9a9a9a; font:700 13.5px var(--mono)}
.m3-tk-cb svg{display:block; width:100%; height:24px; margin-top:8px}
.m3-tk-merci{display:block; text-align:center; font:600 10px var(--mono); color:#555; margin-top:4px}
@container (max-width:780px){ .m3-postits{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container (max-width:500px){ .m3-liege-grille{grid-template-columns:minmax(0,1fr)} [data-decor] .m3-ticket{display:none} }

/* ─── Semaines : le journal des ventes et l'extrait de compte de la Borinage Banque ─── */
@media (min-width:901px) and (max-width:1260px){ #main .m3-defile{overflow-x:auto} }   /* écrans moyens : le journal défile au lieu de passer sous l'extrait */
@media (max-width:640px){                                                               /* téléphone : les montants tiennent sur une ligne ; s'il le faut, le journal défile dans sa carte */
  #main .m3-defile{overflow-x:auto}
  #main table.sales.m3-journal{font-size:12.5px}
  #main .m3-journal th,#main .m3-journal td{padding-left:4px; padding-right:4px}
  #main .m3-journal .tag{white-space:nowrap}
}
#main table.sales.m3-journal{background-color:#fffdf6; background-image:repeating-linear-gradient(180deg, transparent 0 33px, rgba(120,160,210,.2) 33px 34px); color:var(--m3-encre); border-top:6px solid #7a1f3d; box-shadow:var(--ombre-papier)}
#main .m3-journal th{color:var(--m3-marine); font:700 11px var(--doc); letter-spacing:.05em; text-transform:uppercase; border-bottom:2px solid var(--m3-marine); padding-top:10px}
#main .m3-journal td{color:var(--m3-encre); border-bottom:1px solid rgba(120,160,210,.4)}
#main .m3-journal tr.tot td{border-top:2px solid var(--m3-marine); background:rgba(122,31,61,.06)}
#main .m3-journal .tag{color:var(--m3-rose) !important; border-color:rgba(176,18,79,.5)}
#main .ledger.m3-releve{overflow:visible; border:0; border-radius:3px 3px 0 0; margin-bottom:10px}
.m3-releve-tete{display:flex; justify-content:space-between; align-items:center; gap:8px 12px; flex-wrap:wrap; padding:12px 14px 10px; border-bottom:2px solid var(--m3-marine)}
.m3-releve-titre{text-align:right; font-family:var(--doc); min-width:0}
.m3-releve-titre b{display:block; font:800 13px var(--doc); letter-spacing:.08em; text-transform:uppercase; color:var(--m3-marine)}
.m3-releve-titre small{display:block; font:500 11px var(--mono); color:var(--m3-encre-douce); overflow-wrap:anywhere}
#main .m3-releve .ll{border-bottom-color:rgba(20,40,75,.16)}
#main .m3-releve .ll .e{color:var(--m3-encre)}
#main .m3-releve .ll small{color:var(--m3-encre-douce)}
#main .m3-releve .m.pos,#main .m3-releve .lt .pos{color:var(--m3-vert)}
#main .m3-releve .m.neg,#main .m3-releve .lt .neg{color:var(--m3-rouge)}
#main .m3-releve .lt{background:rgba(20,40,75,.06); color:var(--m3-marine)}
.m3-releve-pied{padding:8px 14px 12px; font:600 10.5px var(--mono); letter-spacing:.06em; color:var(--m3-encre-douce)}
.m3-releve-pied .cpt-fictif{margin-top:3px}

/* ─── Semaine 1 : le devis sur papier à en-tête ; semaine 3 : bon de livraison signé, facture agrafée ─── */
#main .paper.m3-devis{border-top:6px solid var(--brand)}
.m3-bl-signe{display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:6px 16px; margin-top:8px}
.m3-bl-signe .signed{font-size:30px !important}
.m3-bl-signe .tampon{margin-right:auto; font-size:14px}
#main .card.m3-brouillon{background:var(--papier) var(--grain); color:var(--m3-encre); border:0; border-top:6px solid var(--brand); border-radius:3px; box-shadow:var(--ombre-papier); -webkit-backdrop-filter:none; backdrop-filter:none}
#main .m3-brouillon h3{color:var(--m3-marine)}
#main .m3-brouillon .help{color:var(--m3-encre-douce)}
#main .m3-brouillon .fact-form label{color:var(--m3-encre-douce); font-weight:600}
#main .m3-brouillon .fact-form input{background:#fff; color:var(--m3-encre); border-color:#c8c0ad; box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
#main .m3-brouillon .fact-form input::placeholder{color:#8a8f9f}
#main .m3-brouillon .fact-form input.ok{border-color:#1f7a45; background:#eef8f1}
#main .m3-brouillon .fact-form input.ko{border-color:#b3261e; background:#fdf0ef}
#main .m3-brouillon .err{color:var(--m3-rouge)}
.m3-brouillon-tete{display:flex; justify-content:space-between; align-items:baseline; gap:4px 12px; flex-wrap:wrap; margin:-6px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--m3-marine)}
.m3-brouillon-tete b{font:800 15px var(--doc); letter-spacing:.08em; text-transform:uppercase; color:var(--m3-marine)}
.m3-brouillon-tete small{font:600 12px var(--doc); color:var(--m3-encre-douce)}

/* ─── Connexion : la pancarte « Ouvert » accrochée à la porte ─── */
#main > .hero{position:relative}
.m3-pancarte{position:absolute; right:30px; top:30px; width:222px; transform-origin:50% 0}
.m3-pancarte.m3-oscille{animation:m3-pancarte 2.4s cubic-bezier(.3,1.4,.4,1) .3s both}
@keyframes m3-pancarte{0%{transform:rotate(14deg)} 30%{transform:rotate(-8deg)} 55%{transform:rotate(4deg)} 78%{transform:rotate(-2deg)} 100%{transform:rotate(0)}}
.m3-clou{display:block; width:12px; height:12px; margin:0 auto; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff 0 1.5px,#c9a24a 2.5px,#6b4c16); box-shadow:0 2px 3px rgba(0,0,0,.5)}
.m3-ficelle{display:block; height:30px; margin:-6px 40px 0; background:linear-gradient(to top right, transparent calc(50% - 1px), #e9dcc0 calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 0 0/50% 100% no-repeat,
  linear-gradient(to top left, transparent calc(50% - 1px), #e9dcc0 calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 100% 0/50% 100% no-repeat}
.m3-pancarte-bois{position:relative; padding:14px 12px 12px; border-radius:12px; text-align:center; background:linear-gradient(180deg,#fffaf0,#f1e6cf); box-shadow:inset 0 0 0 4px #fffaf0, inset 0 0 0 6px #1f7a45, 0 18px 34px rgba(0,0,0,.5)}
.m3-pancarte-bois::before,.m3-pancarte-bois::after{content:""; position:absolute; top:-4px; width:9px; height:9px; border-radius:50%; background:#5d6570; box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.m3-pancarte-bois::before{left:36px} .m3-pancarte-bois::after{right:36px}
.m3-pancarte-bois b{display:block; font:800 34px/1 var(--doc); letter-spacing:.14em; text-transform:uppercase; color:#1f7a45}
.m3-pancarte-bois small{display:block; margin-top:6px; font:600 11px var(--doc); letter-spacing:.06em; color:var(--m3-encre-douce)}

/* ─── Résultat : le compte de résultats, document comptable ─── */
#main .cr.m3-cr{background:var(--papier) var(--grain); color:var(--m3-encre); border:0; border-radius:3px; box-shadow:var(--ombre-papier); overflow:visible}
.m3-doc-tete{display:flex; justify-content:space-between; align-items:baseline; gap:4px 12px; flex-wrap:wrap; padding:16px 16px 10px; border-bottom:2px solid var(--m3-marine)}
.m3-doc-titre{font:800 15px var(--doc); letter-spacing:.08em; text-transform:uppercase; color:var(--m3-marine)}
.m3-doc-tete small{font:600 12px var(--doc); color:var(--m3-encre-douce)}
#main .m3-cr .sect{background:rgba(20,40,75,.06); color:var(--m3-marine); letter-spacing:.05em}
#main .m3-cr .l{border-bottom-color:var(--m3-filet); color:var(--m3-encre)}
#main .m3-cr .l.sub span:first-child{color:var(--m3-encre-douce)}
#main .m3-cr .l span:last-child{white-space:nowrap}
#main .m3-cr .t.pos{background:rgba(31,122,69,.1); color:var(--m3-vert)}
#main .m3-cr .t.neg{background:rgba(179,38,30,.08); color:var(--m3-rouge)}
.m3-doc-pied{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 16px 14px}
.m3-doc-pied .cpt-fictif{margin:0}
.m3-doc-pied .tampon{font-size:17px; margin-left:auto}

/* ─── Bilan (écran du bilan et écran de fin) : document officiel, balance équilibrée ─── */
#main .bilan.m3-bilan{background:#fbfcff; color:var(--m3-encre); border:8px solid transparent; border-radius:6px; overflow:visible;
  border-image:repeating-linear-gradient(45deg,#9fb6d6 0 2px,#eef3fa 2px 5px,#c7a75a 5px 6px,#eef3fa 6px 9px) 8; box-shadow:inset 0 0 0 1px #9fb6d6, var(--ombre-papier)}
#main .m3-bilan .col+.col{border-left-color:#c9d3e3; border-top-color:#c9d3e3}
#main .m3-bilan h5{background:#eef3fa; border-bottom-color:#c9d3e3; color:var(--m3-marine)}
#main .m3-bilan h5 small{color:var(--m3-encre-douce)}
#main .m3-bilan .l{border-bottom-color:#dfe5ee}
#main .m3-bilan .l .k{color:var(--m3-encre-douce)} #main .m3-bilan .l .k b{color:var(--m3-encre)}
#main .m3-bilan .sect{color:var(--m3-encre-douce)}
#main .m3-bilan .t{background:#eef3fa; border-top-color:var(--m3-marine); color:var(--m3-marine)}
.m3-bilan-tete{grid-column:1 / -1; display:flex; justify-content:space-between; align-items:baseline; gap:4px 12px; flex-wrap:wrap; padding:14px 16px 10px; border-bottom:2px solid var(--m3-marine); background:#fbfcff}
.m3-bilan-tete .m3-doc-titre{font-size:17px; letter-spacing:.14em}
.m3-bilan-tete small{font:600 12px var(--doc); color:var(--m3-encre-douce)}
.m3-bilan-pied{grid-column:1 / -1; display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; padding:10px 16px 12px; border-top:1px solid #c9d3e3; background:#fbfcff}
.m3-bilan-pied .cpt-balance{width:112px; margin:0}
.m3-bilan-pied .tampon{font-size:16px}
.m3-bilan-pied .cpt-fictif{margin:0 0 0 auto}

/* ─── Fin : la boutique allumée, en fête ─── */
.front-wrap.m3-fete{position:relative}
.m3-guirlande{position:absolute; left:0; right:0; top:0; pointer-events:none}
.m3-guirlande svg{display:block; width:100%; height:auto}

/* ─── Fermé, bloqué : la boutique fermée, la nuit ─── */
.m3-nuit{max-width:500px; margin:28px auto 0; border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--line2); box-shadow:0 26px 70px rgba(0,0,0,.6)}
.m3-nuit svg{display:block; width:100%; height:auto}

/* ─── Tableau de bord : le stock de la réserve en cartons ─── */
#side .equip > div.m3-boite{color:#2b1d0e; border-radius:6px; box-shadow:inset 0 -4px 8px rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.35); background-color:#c79a62;
  background-image:linear-gradient(90deg, transparent 44%, rgba(255,255,255,.28) 44% 56%, transparent 56%), repeating-linear-gradient(90deg, rgba(90,60,25,.10) 0 2px, transparent 2px 6px), linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.12))}
#side .equip > div.m3-boite.ok{border:1px solid rgba(255,255,255,.22)}
#side .equip > div.m3-boite-vide{background:transparent; border:1.5px dashed rgba(255,61,139,.75)}

@media (max-width:640px){
  #main .decide{grid-template-columns:minmax(0,1fr)}                  /* cartes de choix (publicité, retour, promotion) : une par ligne, texte lisible */
  .m3-ouverture{grid-template-columns:minmax(0,1fr); gap:14px; margin-bottom:22px}
  .m3-reserve{padding:12px 12px 0}
  .m3-reserve-rayon{gap:10px; min-height:104px; padding:34px 14px 0; margin:0 -12px}
  .m3-carton{height:70px}
  .m3-carton-emoji{font-size:21px; left:6px; top:6px}
  .m3-carton-etiq{right:4px; bottom:5px; width:76%; padding:3px 4px}
  .m3-carton-etiq b{font-size:12px}
  .m3-reserve-rayon::before{left:6px} .m3-reserve-rayon::after{right:6px}
  .kit-route.m3-livraison{height:150px}
  .m3-livraison .kit-camion{left:4px; bottom:14px; width:196px}
  .m3-pile{right:8px; bottom:14px}
  .m3-colis{width:64px; height:44px}
  [data-decor] .m3-colis-etiq,[data-decor] .m3-colis-fragile{display:none}
  #main .ecriture.cpt-registre{padding:14px 12px; background-image:repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,160,210,.38) 27px 28px) !important; border-left:4px double rgba(217,83,79,.55)}
  #main .paper .doc-lines{font-size:12.5px}
  #main .paper .doc-lines th,#main .paper .doc-lines td{padding:6px 4px}
  #main .ecriture.cpt-registre th{font:700 10.5px var(--doc) !important; letter-spacing:0}
  #main .ecriture.cpt-registre td.n{white-space:normal}
  .bureau.m3-prix{padding:16px 12px; justify-content:center}
  .m3-etiquettes{flex-direction:row; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px 8px}
  .m3-etiquettes-titre{flex-basis:100%; text-align:center}
  .m3-etiq{padding-left:0}
  [data-decor] .m3-etiq::before,[data-decor] .m3-etiq::after{display:none}
  .m3-etiq.actif{transform:none}
  .m3-etiq .cpt-etiquette{font-size:15px; padding:7px 10px 7px 22px}
  .m3-etiq .cpt-etiquette small{max-width:74px; font-size:9.5px}
  .cpt-liege.m3-liege{padding:18px 14px 20px}
  .m3-postits{gap:14px 12px}
  .m3-liege .cpt-postit{font-size:20px; min-height:80px}
  .m3-bilan-pied .cpt-balance{width:76px}
  .m3-nuit{margin-top:22px}
}
/* ─── Photos de matières (images/carton.webp, CC0) sur les cartons du tableau de bord ; le dessin reste si l'image manque ─── */
#side .equip > div.m3-boite{background-image:linear-gradient(90deg, transparent 44%, rgba(255,255,255,.28) 44% 56%, transparent 56%), linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.12)), var(--cpt-img-carton), repeating-linear-gradient(90deg, rgba(90,60,25,.10) 0 2px, transparent 2px 6px);
  background-size:auto, auto, 160px 160px, auto}
/* ─── V2 : de 901 à 1 279 px (vidéoprojecteur en 1 024 px, portable zoomé), une seule colonne comme sur tablette :
       rien ne passe sous le tableau de bord, qui passe dessous (vitrine et carte de l'entreprise côte à côte) ─── */
@media (min-width:901px) and (max-width:1279px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .layout aside{position:static}
  .dash{position:static; max-height:none}
}
@media (min-width:641px) and (max-width:1279px){
  .dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:center}
}
/* ─── V2 : l'échange impossible (plus d'article libre en stock) ─── */
.decide .choice[disabled]{opacity:.45; cursor:not-allowed; filter:grayscale(.6)}
/* ─── V2 : l'avis du client mécontent, selon la décision ─── */
.m3-avis{display:grid; gap:4px; max-width:460px; margin:14px 0 0; padding:12px 16px; border-radius:12px; color:#1f2433; font:500 15px var(--doc); background:#fffdf6; box-shadow:var(--ombre-objet, 0 10px 24px rgba(0,0,0,.35)); transform:rotate(-1deg); animation:m3-sc-entre .4s ease-out both}
.m3-avis-etoiles{font-size:22px; letter-spacing:.08em; color:#e3a008}
.m3-avis-mauvais .m3-avis-etoiles{color:#c62828}
.m3-avis-texte{font-style:italic}
.m3-avis small{font-size:12px; color:#6b6f88}
/* ─── V2 : bilan, le surligneur passe sur ce que le mois a changé ─── */
.m3-fluo{background-image:linear-gradient(90deg, rgba(255,226,59,.5), rgba(255,226,59,.5)) !important; background-repeat:no-repeat !important; background-size:0 100%; animation:m3-fluo .8s .5s ease-out forwards}
@keyframes m3-fluo{to{background-size:100% 100%}}
/* ─── V2 : films (3 s au plus, comme aux 3P) : publicité, ouverture, courrier, livraison, facture ─── */
.m3-sc{position:relative; display:flex; justify-content:center; align-items:center; gap:28px; width:100%; animation:m3-sc-entre .35s ease-out both}
@keyframes m3-sc-entre{from{opacity:0; transform:scale(.96)}}
.m3-flyer{position:relative; z-index:2; display:grid; justify-items:center; gap:4px; width:190px; padding:16px 14px 14px; border-radius:6px; text-align:center; color:#1f2433; font:500 13px var(--doc);
  background:linear-gradient(160deg,#fff7d6,#ffe1ec); box-shadow:0 18px 40px rgba(0,0,0,.45); transform:rotate(-4deg) scale(.6); opacity:0; transition:transform .45s cubic-bezier(.3,1.5,.5,1), opacity .3s}
.m3-flyer.vu,.m3-post .m3-flyer{opacity:1; transform:rotate(-4deg)}
.m3-flyer-sym{font-size:30px; line-height:1}
.m3-flyer b{font:800 17px var(--display, var(--doc)); line-height:1.15}
.m3-flyer-ouv{padding:3px 12px; border-radius:999px; font:800 13px var(--doc); letter-spacing:.06em; text-transform:uppercase; color:#fff; background:linear-gradient(90deg,#ff3d8b,#9d4edd)}
.m3-flyer small{font-size:11.5px; color:#4a5068}
.m3-sc-flyers{flex-direction:column; gap:22px}
.m3-maisons{display:flex; gap:26px; align-items:flex-end}
.m3-maison{position:relative; width:104px; height:96px; border-radius:4px; background:#efe2c9; box-shadow:0 12px 26px rgba(0,0,0,.4)}
.m3-maison-toit{position:absolute; left:-10px; right:-10px; top:-34px; height:36px; background:#9d4b3e; clip-path:polygon(50% 0,100% 100%,0 100%)}
.m3-maison-fen{position:absolute; left:14px; top:16px; width:26px; height:24px; border:3px solid #6b4a2f; background:#ffe9a8}
.m3-maison-porte{position:absolute; right:16px; bottom:0; width:24px; height:46px; border-radius:3px 3px 0 0; background:#6b4a2f}
.m3-bal-mini{position:absolute; left:14px; bottom:12px; width:30px; height:22px; border-radius:4px 4px 2px 2px; background:#d9534f}
.m3-bal-mini::after{content:""; position:absolute; left:5px; right:5px; top:6px; height:3px; border-radius:2px; background:#5b1d1a}
.m3-fl-vole{position:absolute; left:4px; top:-62px; width:22px; height:28px; border-radius:2px; background:linear-gradient(160deg,#fff7d6,#ffe1ec); box-shadow:0 4px 10px rgba(0,0,0,.35); opacity:0; transform:translateY(-30px) rotate(-20deg)}
.m3-fl-vole.dedans{animation:m3-fl-glisse .55s cubic-bezier(.5,0,.3,1) forwards}
@keyframes m3-fl-glisse{0%{opacity:1; transform:translateY(-30px) rotate(-20deg)} 70%{opacity:1; transform:translateY(58px) rotate(0)} 100%{opacity:0; transform:translateY(64px) scale(.6)}}
.m3-sc-phone{width:270px; margin:0; padding:46px 12px 18px !important; min-height:420px; color:#fff}
.m3-sc-phone::after{display:none}
.m3-post{margin-top:8px; padding:10px; border-radius:14px; color:#1f2433; background:#fff; opacity:0; transform:translateY(16px); transition:opacity .35s, transform .4s cubic-bezier(.3,1.4,.5,1)}
.m3-post.vu{opacity:1; transform:none}
.m3-post-tete{display:flex; align-items:center; gap:8px; margin-bottom:10px; text-align:left; font:500 12px var(--doc)}
.m3-post-tete b{display:block; font:700 14px var(--doc)}
.m3-post-tete small{color:#6b6f88}
.m3-post-av{flex:none; width:34px; height:34px; display:grid; place-items:center; border-radius:50%; font-size:18px; background:#f1f3f7}
.m3-post .m3-flyer{width:auto; margin:0 6px; transform:none}
.m3-post-bas{display:flex; justify-content:space-between; margin-top:10px; padding:8px 4px 0; border-top:1px solid #eceef3; font:600 13px var(--doc); color:#4a5068}
.m3-notif{margin-top:12px; padding:10px 12px; border-radius:12px; font:600 13.5px var(--doc); color:#1f2433; background:rgba(255,255,255,.92); opacity:0; transform:translateY(-10px); transition:opacity .3s, transform .35s cubic-bezier(.3,1.5,.5,1)}
.m3-notif.vu{opacity:1; transform:none}
.m3-sc-comptoir{flex-direction:column; gap:0; width:min(560px,100%); min-height:330px; justify-content:flex-end; overflow:hidden; border-radius:16px; background:linear-gradient(180deg,#3b2f5c,#2a2346); box-shadow:0 30px 70px rgba(0,0,0,.6)}
.m3-cpt-fond{position:absolute; left:0; right:0; top:0; height:120px; display:flex; justify-content:space-between; align-items:center; padding:0 22px}
.m3-cpt-pancarte{padding:6px 14px; border-radius:6px; font:800 16px var(--doc); color:#2b1d02; background:#e3b85c; transform:rotate(-3deg)}
.m3-cpt-etagere{padding:6px 14px 10px; font-size:30px; letter-spacing:.2em; border-bottom:6px solid #8a5a2b}
.m3-cpt-client{position:absolute; left:-12%; bottom:92px; font-size:76px; line-height:1; transition:left .6s cubic-bezier(.3,.9,.4,1)}
.m3-sc-comptoir.entre .m3-cpt-client{left:16%}
.m3-cpt-bulle{position:absolute; left:34%; top:118px; max-width:56%; padding:9px 14px; border-radius:14px; font:600 15px var(--doc); color:#1f2433; background:#fff; opacity:0; transform:scale(.6); transform-origin:left bottom; transition:opacity .25s, transform .35s cubic-bezier(.3,1.6,.5,1)}
.m3-sc-comptoir.parle .m3-cpt-bulle{opacity:1; transform:none}
.m3-cpt-comptoir{position:relative; z-index:2; display:flex; justify-content:flex-end; align-items:flex-end; gap:16px; width:100%; height:96px; padding:0 22px 14px; background:linear-gradient(180deg,#8a5a2b,#6b4423)}
.m3-cpt-caisse{position:relative; width:150px; height:86px; margin-bottom:6px; border-radius:10px 10px 4px 4px; background:#e9ecf4; box-shadow:0 10px 20px rgba(0,0,0,.4)}
.m3-cpt-ecran{position:absolute; left:10px; right:10px; top:10px; display:grid; padding:4px 8px; border-radius:6px; text-align:right; font:800 17px var(--mono); color:#062a19; background:#7dffb5}
.m3-cpt-ecran small{font:600 10px var(--doc); color:#1f5c3a}
.m3-cpt-tiroir{position:absolute; left:8px; right:8px; bottom:-10px; height:14px; border-radius:3px; background:#c9cdd6; transition:bottom .25s}
.m3-sc-comptoir.encaisse .m3-cpt-tiroir{bottom:-22px}

.m3-cpt-tpe{display:grid; justify-items:center; gap:2px; width:62px; height:84px; margin-bottom:8px; padding-top:8px; border-radius:10px; font-size:24px; background:#1f2433; color:#9ff0c9}
.m3-cpt-tpe b{font:800 11px var(--doc); opacity:0; transition:opacity .2s}
.m3-sc-comptoir.paie .m3-cpt-tpe b{opacity:1}
.m3-sc-comptoir.paie .m3-cpt-carte{animation:m3-carte .35s ease-out}
@keyframes m3-carte{from{transform:translateY(-26px) rotate(-12deg)}}
.m3-sc-courrier{flex-direction:column; gap:12px; min-height:340px; justify-content:flex-start}
.m3-bal{position:relative; width:220px; height:96px; border-radius:16px 16px 6px 6px; background:linear-gradient(180deg,#d9534f,#b63d39); box-shadow:0 16px 34px rgba(0,0,0,.5)}
.m3-bal-nom{position:absolute; left:14px; right:14px; bottom:12px; padding:3px 6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; border-radius:4px; text-align:center; font:700 12px var(--doc); color:#1f2433; background:#fffdf6}
.m3-bal-fente{position:absolute; left:40px; right:40px; top:20px; height:8px; border-radius:4px; background:#5b1d1a}
.m3-lettres{position:relative; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; width:min(460px,100%)}
.m3-lettre{display:grid; grid-template-columns:auto minmax(0,1fr); gap:0 8px; align-items:center; padding:8px 12px; border-radius:4px; font:500 13px var(--doc); color:#1f2433; background:#fffdf6; box-shadow:0 8px 18px rgba(0,0,0,.4); opacity:0; transform:translateY(-120px) rotate(calc(var(--k, 0) * 5deg - 6deg))}
.m3-lettre > span{grid-row:span 2; font-size:22px}

.m3-lettre.tombe{animation:m3-tombe .5s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes m3-tombe{to{opacity:1; transform:rotate(calc(var(--k, 0) * 2deg - 3deg))}}
.m3-sc-livre{flex-direction:column; gap:14px; width:min(620px,100%)}
.m3-livre-route{position:relative; width:100%; height:150px; overflow:hidden; border-radius:14px; background:linear-gradient(180deg,#2a2f63 0 62%,#4a4b55 62%)}
.m3-livre-route::after{content:""; position:absolute; left:0; right:0; bottom:22px; height:3px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.7) 0 26px, transparent 26px 52px)}
.m3-livre-route .kit-camion{position:absolute; left:-62%; bottom:8px; width:240px; transition:left 1.6s cubic-bezier(.3,.7,.4,1)}
.m3-sc-livre.roule .kit-camion{left:56%}
.m3-livre-client{position:relative; display:grid; justify-items:center; gap:2px; width:min(380px,100%); padding:12px 18px; border-radius:12px; text-align:center; color:#1f2433; font:500 13px var(--doc); background:#fffdf6; box-shadow:0 14px 30px rgba(0,0,0,.45)}
.m3-livre-av{font-size:34px; line-height:1}
.m3-livre-client b{font:800 16px var(--doc)}
.m3-livre-client small{color:#4a5068}
.m3-livre-ok{position:absolute; right:10px; top:10px; opacity:0; transform:rotate(-10deg) scale(1.6); transition:opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1)}
.m3-sc-livre.livre .m3-livre-ok{opacity:1; transform:rotate(-10deg)}
.m3-sc-enveloppe{min-height:300px}

}
function mod97(str){ let r = 0; for (const ch of str) r = (r*10 + +ch) % 97; return r; }
function genIBAN(){
  const bank = ["001","063","068","310","363","523","732","751"][Math.floor(Math.random()*8)];

function bilanHTML(opts={}){
  const d = bilanData();
  const col = (titre, sous, lignes, total) => { let rub = null;
    return `<div class="col"><h5>${titre}<small>${sous}</small></h5>${lignes.map(l => { const h = l.rubrique !== rub ? `<div class="sect">${esc(l.rubrique)}</div>` : ""; rub = l.rubrique;
      return h + `<div class="l"><span class="k"><b>${esc(opts.court ? l.court : l.libelle)}</b></span><span class="v">${euro(l.montant)}</span></div>`; }).join("")}
      <div class="t"><span>Total</span><span>${euro(total)}</span></div></div>`; };
  // V2 : chaque colonne a son propre total, et le pied compare vraiment l'actif au passif
  return `<div class="bilan">${col("ACTIF", "ce que l'entreprise possède", d.actif, d.total)}${col("PASSIF", "d'où vient l'argent", d.passif, d.totalPassif)}</div>
    ${opts.foot === false ? "" : `<div class="bilan-foot"><span>Les deux totaux sont égaux : <b>Actif = Passif</b>. Chaque euro possédé a une origine.</span><span class="money">${euro(d.total)} = ${euro(d.totalPassif)}</span></div>`}`;
}

function jaugeAutonomie(){
  const a = autonomie(), pct = a == null ? 0 : Math.min(100, Math.round(a / 12 * 100));
  const cls = a == null ? "" : a < 3 ? "bad" : a < 6 ? "warn" : "ok";
  const txt = a == null ? "Choisis un local pour connaître tes charges." : a < 3 ? "Danger : moins de 3 mois d'avance. Un démarrage lent et c'est la faillite." : a < 6 ? "Prudent : tu tiens quelques mois sans vendre. Il faudra vendre vite." : "Solide : tu as le temps de te faire connaître.";
  return `<div class="big-n ${cls}" style="color:${cls === "bad" ? "var(--coral)" : cls === "warn" ? "var(--amber)" : "var(--mint)"}">${a == null ? "–" : a}<small> mois d'autonomie</small></div>
    <div class="gauge"><i style="width:${pct}%"></i></div><div class="gauge-l"><span>0</span><span>3 mois</span><span>6 mois</span><span>12 mois</span></div>
    <div class="help">${txt}</div>`;
}

    direction, nbAssocies: +ent.nbAssocies || +et.nbAssocies || 1,
    apport: fi.apportParFondateur || et.apport || null, emprunt: fi.emprunt != null ? fi.emprunt : (et.emprunt != null ? et.emprunt : null),
    ids: (ent.numeroEntreprise || (et.ids || {}).bce) ? { bce: ent.numeroEntreprise || et.ids.bce, iban: ent.iban || (et.ids || {}).iban || "" } : null,
    dateCreation: ent.dateCreation || et.dateCreation || "", signature: (m.declaration || {}).signature || "",
    concurrent: ((m.bonus || {}).concurrent) || ((et.bonus || {}).concurrent) || "", quiz: et.quiz || {}, defis: m.defisEclair || [],
    ancien, legacy: ancien ? ent.argent || null : null
  };
  if (ancien && ent.argent){ E.apport = ent.argent.argentDeDepart || 10000; E.nbAssocies = 1; E.emprunt = 0; }
  return E;
}

function simulation(){

/** Appelle une fonction de la base. Erreurs possibles : « reseau », « timeout », « serveur ». */
async function rpc(fonction, args, timeout = 15000, keepalive = false){
  if (CONFIG.HORS_LIGNE) throw new Error("reseau");
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/rpc/" + fonction, { method:"POST", keepalive, signal:ctrl.signal,
      headers:{ "apikey":CONFIG.SUPABASE_CLE, "Content-Type":"application/json" }, body:JSON.stringify(args) });
    if (!r.ok) throw new Error("serveur");
    return await r.json();
  } catch(e) {
    throw new Error(e.name === "AbortError" ? "timeout" : e.message === "serveur" ? "serveur" : "reseau");
  } finally { clearTimeout(t); }
}
/** Lectures « ping » et « connexion ». Le nom « jsonp » est historique : l'appel garde sa forme et ses réponses. */
function jsonp(params, timeout = 15000){
  const mission = String(params.mission || CONFIG.MISSION);
  return params.action === "ping" ? rpc("mc_ping", { p_mission:mission }, timeout)
    : rpc("mc_connexion", { p_email:params.email, p_mission:mission }, timeout);
}

  if (force || ecoule >= PAUSE_SAUVEGARDE){ annulerSauvegardePrevue(); DERNIERE_SAUVEGARDE = Date.now(); envoyer("en_cours"); return; }

function cashChart(wCur){ const sim = SIM(), pts = [M2.banque].concat(sim.semaines.map(s => s.fin)), min = Math.min(0, ...pts), max = Math.max(...pts) * 1.08 || 1;
  const W = 520, H = 170, L = 54, Rr = 14, T = 16, Bt = 30, x = (i) => L + i * (W - L - Rr) / 4, y = (v) => T + (H - T - Bt) * (1 - (v - min) / (max - min));
  const path = (a, b) => pts.slice(a, b + 1).map((v, i) => `${i ? "L" : "M"}${x(a + i)} ${y(v)}`).join(" ");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la banque">
    ${[0, .5, 1].map(f => { const v = min + (max - min) * f; return `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.1)"/><text x="${L - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="rgba(255,255,255,.55)" style="font-family:'IBM Plex Mono',monospace">${Math.round(v / 1000 * 10) / 10} k</text>`; }).join("")}
    ${pts.map((v, i) => `<text x="${x(i)}" y="${H - 10}" font-size="11" text-anchor="middle" fill="rgba(255,255,255,.6)" style="font-family:'IBM Plex Sans',Arial">${i ? "S" + i : "Début"}</text>`).join("")}
    <path d="${path(0, Math.max(0, wCur))}" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    ${wCur < 4 ? `<path d="${path(wCur, 4)}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-dasharray="5 6"/>` : ""}
    ${pts.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === wCur ? 6 : 4}" fill="${i <= wCur ? "#34d399" : "rgba(255,255,255,.35)"}"/><text x="${x(i)}" y="${y(v) - 10}" font-size="10.5" text-anchor="middle" fill="${i <= wCur ? "#fff" : "rgba(255,255,255,.55)"}" style="font-family:'IBM Plex Mono',monospace">${euro0(v)}</text>`).join("")}
  </svg><div class="help" style="margin:0 0 6px">Trait plein : semaines clôturées · pointillés : prévision avec tes décisions actuelles.</div></div>`; }
function ledger(w){ const s = SIM().semaines[w - 1];
  return `<div class="ledger">${s.lignes.map(l => `<div class="ll"><span class="e">${l.e}</span><span>${esc(l.t)}<small>${esc(l.s)}</small></span><span class="m ${l.m > 0 ? "pos" : l.m < 0 ? "neg" : ""}">${l.m > 0 ? "+ " : l.m < 0 ? "− " : ""}${l.m ? euro(Math.abs(l.m)) : "0\u00a0€"}</span></div>`).join("")}
    <div class="lt"><span>Banque : ${euro(s.debut)} → ${euro(s.fin)}</span><span class="${s.flux >= 0 ? "pos" : "neg"}">${s.flux >= 0 ? "+" : "−"} ${euro(Math.abs(s.flux))}</span></div></div>`; }
function ventesTable(w){ const s = SIM().semaines[w - 1], manques = s.ventes.filter(v => v.manque > 0);
  return `<table class="sales"><thead><tr><th>Article</th><th class="n">Vendus</th><th class="n">Prix TTC</th><th class="n">CA HT</th><th class="n">Stock restant</th></tr></thead><tbody>${s.ventes.map(v => `<tr><td>${arts()[v.i].emoji} ${esc(arts()[v.i].nom)}${s.promo ? ' <span class="tag" style="font-size:11px;padding:2px 7px;margin:0;color:var(--pink)">promo −15\u00a0%</span>' : ""}</td><td class="n">${v.q}</td><td class="n">${euro(v.pu)}</td><td class="n">${euro(r2(v.q * v.puHT))}</td><td class="n">${s.stock[v.i]}${s.stock[v.i] === 0 ? " ⚠" : ""}</td></tr>`).join("")}<tr class="tot"><td>Total de la semaine</td><td class="n">${s.ventes.reduce((t, v) => t + v.q, 0)}</td><td></td><td class="n">${euro(s.caHT)}</td><td></td></tr></tbody></table>
    ${manques.length ? `<div class="help" style="color:var(--amber)">⚠ Rupture de stock : ${manques.map(v => `${v.manque} client${v.manque > 1 ? "s" : ""} sans ${esc(arts()[v.i].nom.toLowerCase())}`).join(", ")} : autant de ventes perdues.</div>` : ""}
    ${w === 4 && s.perdus.some(q => q > 0) ? `<div class="help" style="color:var(--amber)">🗑️ Fin du mois : ${s.perdus.map((q, i) => q ? `${q} ${esc(arts()[i].unite)}${q > 1 ? "s" : ""} (${esc(arts()[i].nom.toLowerCase())})` : "").filter(Boolean).join(", ")} invendus abîmés, jetés (${Math.round(PERTE_FRAIS * 100)}\u00a0% des invendus frais). Le stock restant en tient compte.</div>` : ""}`; }

/** V2 : ordre d'affichage des réponses d'un défi, mélangé une fois pour toutes par élève (la bonne réponse n'est plus toujours la 2e). */
const ordreQuiz = (key, n) => { const o = [...Array(n).keys()], h = hash((S.eleve.email || "") + "quiz" + key); for (let i = n - 1; i > 0; i--){ const j = (h >>> (i * 3)) % (i + 1); [o[i], o[j]] = [o[j], o[i]]; } return o; };
function quiz(key){ const q = M3_QUIZ[key], r = S.quiz[key]; return `<div class="quiz"><h4>⚡ Défi éclair <span class="pts">+50 XP</span></h4><p>${esc(q.q)}</p><div class="q">${ordreQuiz(key, q.opts.length).map(i => [q.opts[i], i]).map(([o,i]) => `<button data-quiz="${key}" data-i="${i}" ${r ? "disabled" : ""} class="${r ? (i === q.ok ? "ok" : (i === r.rep ? "ko" : "")) : ""}">${esc(o)}</button>`).join("")}</div>${r ? `<div class="exp">${r.ok ? "✔ Exact." : "✘ Pas tout à fait."} ${esc(q.exp)}</div>` : ""}</div>`; }
function ecritureAchat(f){ return `<div class="ecriture"><h4>🎓 L'écriture comptable</h4><table><thead><tr><th>Compte</th><th>Libellé</th><th class="n">Débit</th><th class="n">Crédit</th></tr></thead><tbody>

  ${f.lignes.some(l => l.remise) ? `<tr><td class="n" style="color:var(--muted)">608</td><td>Remises obtenues</td><td></td><td class="n">${euro(r2(f.lignes.reduce((s, l) => s + l.remise, 0)))}</td></tr>` : ""}<tr><td class="n" style="color:var(--muted)">440</td><td>Fournisseur ${esc(march().fournisseur.nom)}</td><td></td><td class="n">${euro(f.totalTTC)}</td></tr></tbody></table><div class="help">Les marchandises entrent en stock ; la dette fournisseur attend son échéance.</div></div>`; }

      <div class="card tight"><h3>Aperçu de ta commande</h3>${apercu.lignes.length ? `<table class="led"><tbody>${apercu.lignes.map(l => `<tr><td>${l.emoji} ${l.qte} × ${euro(l.pu)}</td><td class="n">${euro(l.net)}${l.remise ? ` <small class="pos">−${euro(l.remise)}</small>` : ""}</td></tr>`).join("")}<tr><td>Port</td><td class="n">${apercu.port ? euro(apercu.port) : "offert ✓"}</td></tr><tr><td>Total HT</td><td class="n">${euro(apercu.totalHT)}</td></tr><tr><td>TVA ${pctTVA()}\u00a0%</td><td class="n">${euro(apercu.tva)}</td></tr><tr class="tot"><td>Total TTC (à 30 jours)</td><td class="n">${euro(apercu.totalTTC)}</td></tr></tbody></table>
        ${apercu.marchandises < COND.francoDes ? `<p class="help">Encore ${euro(r2(COND.francoDes - apercu.marchandises))} HT pour le franco de port.</p>` : ""}<p class="help">Tu ne paies rien aujourd'hui, mais la dette apparaîtra au bilan. Ce stock vaudra ${euro(stockValeur(S.qtes.map(q => q || 0)))} à l'actif.</p>` : `<p class="help">Indique les quantités pour voir la facture.</p>`}</div></div>`
    + nav(ok, S.pub == null ? "Choisis ta publicité d'ouverture." : "Au moins une unité de chaque article.", {label:"Passer la commande"}); };

R.reception = () => { const f = S.commande, ok = S.checks.every(Boolean) && S.signBL.trim().length >= 3;
  return head("Décision 2 · la réception", "La <span class='grad'>marchandise</span> arrive", `${f.unites} unités livrées par ${esc(march().fournisseur.nom)} avec leur bon de livraison et leur facture.`) + coach("reception")
    + `<div class="grid g2" style="align-items:start"><div>${blGrossiste(f)}<div class="checks" style="margin-top:14px">${["Les références livrées sont celles commandées", `Les quantités correspondent : ${f.unites} unités au total`, "Les colis sont en bon état, rien de cassé"].map((t, i) => `<label class="check ${S.checks[i] ? "ok" : ""}"><input type="checkbox" data-chk="${i}" ${S.checks[i] ? "checked" : ""}><span>${t}</span></label>`).join("")}</div></div>
      <div>${factureAchatDoc(f)}${ecritureAchat(f)}</div></div>` + nav(ok, "Trois vérifications et une signature.", {label:"Accepter la livraison"}); };

function prixInfo(i){ const pct = Math.round(margeU(i) / pvHT(i) * 100), prev = previsionMois(i), st = stockCommande(i), r = pvTTC(i) / prixAttendu(i);
  return `<div class="price-row"><div>Prix affiché TTC<b style="color:var(--gold2)">${euro(pvTTC(i))}</b></div><div>Prix HT<b>${euro(pvHT(i))}</b></div><div>Marge / unité<b style="color:${margeU(i) > 0 ? "var(--mint)" : "var(--coral)"}">${euro(margeU(i))} <small style="font-family:var(--ui);color:var(--muted)">(×${String(coef(i)).replace(".", ",")})</small></b></div><div>Prévision du mois<b style="color:${prev > st ? "var(--amber)" : "var(--text)"}">${prev} ${prev > st ? "⚠ > stock " + st : "/ " + st + " en stock"}</b></div></div>
    <div class="mbar"><i style="width:${Math.min(100, Math.max(0, pct))}%"></i></div><div class="help">Taux de marque ${pct}\u00a0% (marge ÷ prix de vente HT)${r > borne() + 1e-9 ? " · bien au-dessus de ce que ta clientèle accepte : les ventes s'effondrent" : r > 1.02 ? " · au-dessus du prix attendu : moins de ventes, plus de marge par vente" : r < 0.95 ? " · sous le prix attendu : plus de ventes, moins de marge par vente" : " · le prix attendu par ta clientèle"}</div>`; }
R.prix = () => { const tot = [0,1,2].reduce((s, i) => { const q = Math.min(stockCommande(i), previsionMois(i)); return { q:s.q + q, ca:s.ca + q * pvHT(i), marge:s.marge + q * margeU(i) }; }, { q:0, ca:0, marge:0 });
  const c = CLIENTELES.find(x => x.id === M1.clientele);
  const st = STRATEGIES.find(x => x.id === M1.strategie), pubHT = (PUBS.find(p => p.id === S.pub) || PUBS[0]).coutHT;
  const interets = r2(V1(emprunt_) * TAUX / 12), fixes = r2(V1(() => loyer() + CHARGES_AUTRES) + interets), capital = r2(V1(mensualite_) - interets);   // le capital remboursé n'est pas une charge
  return head("Décision 3 · les prix", "Fixe tes <span class='grad'>prix de vente</span>", `${c ? esc(c.nom) + " " : "Tes clients "}${elast() >= 2.4 ? "fuient dès que c'est cher" : elast() >= 1.8 ? "comparent les prix" : "regardent d'abord la qualité et acceptent de payer un peu plus"}. Ta stratégie${st ? ` « ${esc(st.nom)} »` : ""} : le curseur part du <b>prix conseillé</b>, ${M1.strategie === "petit" ? "10\u00a0% sous le prix du marché" : M1.strategie === "haut" ? "15\u00a0% au-dessus du prix du marché" : "le prix du marché"}. Observe la prévision.`) + coach("prix")
    + arts().map((a, i) => { return `<div class="art"><div class="ai">${a.emoji}</div><div><h4>${esc(a.nom)} <small style="color:var(--muted);font-weight:400">· achat ${euro(pa(i))} HT · marché ${euro(ref(i))} TTC${prixConseille(i) !== ref(i) ? ` · conseillé ${euro(prixConseille(i))} TTC` : ""}</small></h4>
      <input type="range" class="pr" min="${prixMin(i)}" max="${prixMax(i)}" step="${pasPrix(i)}" value="${pvTTC(i)}" data-prix="${i}" aria-label="Prix de vente ${esc(a.nom)}">
      <div class="pr-info" data-info="${i}">${prixInfo(i)}</div></div></div>`; }).join("")
    + `<div class="stat3"><div class="s"><span>Ventes prévues (limitées par le stock)</span><b>${tot.q} articles</b></div><div class="s"><span>Chiffre d'affaires HT prévu</span><b>${euro0(tot.ca)}</b></div><div class="s"><span>Marge brute prévue</span><b style="color:${tot.marge >= fixes + pubHT ? "var(--mint)" : "var(--coral)"}">${euro0(tot.marge)}</b></div></div>
    <div class="help">Tes charges fixes du mois : ${euro0(fixes)} (loyer, assurances et énergie, intérêts de l'emprunt)${pubHT ? `, plus ${euro0(pubHT)} de publicité` : ""}. ${tot.marge >= fixes + pubHT ? "La marge prévue les couvre : tu devrais être bénéficiaire." : "La marge prévue ne les couvre pas : prix, volumes ou stock à revoir… ou compte sur la grosse commande."}${capital > 0 ? ` Le capital de l'emprunt (${euro0(capital)}) se rembourse aussi ce mois-ci : ce n'est pas une charge, mais c'est de l'argent qui sort.` : ""}</div>${quiz("prix")}`
    + nav(S.prix.every(p => p != null), "Règle les trois prix.", {label:"Ouvrir la boutique"}); };

function devisInfo(){ const d = S.devis; return `<div class="price-row"><div>Prix unitaire HT<b style="color:var(--gold2)">${euro(d.pu != null ? d.pu : puMarche())}</b></div><div>Remise<span class="chips" style="margin-top:4px">${[0,5,10].map(x => `<button class="chip ${d.remise === x ? "on" : ""}" data-remise="${x}" style="padding:4px 10px;font-size:13px">${x}\u00a0%</button>`).join("")}</span></div><div>Marge / unité<b style="color:${devisNet() - pa(iStrat()) > 0 ? "var(--mint)" : "var(--coral)"}">${euro(r2(devisNet() - pa(iStrat())))}</b></div><div>Total du devis HT<b>${euro(devisHT())}</b></div></div>`; }
R.s1 = () => { const c = march().client, a = artClient(), d = S.devis, stockApres = stockApresS1(), besoin = besoinComplement();
  const complementOK = !devisAccepte() || besoin === 0 || !!d.complement;
  const chat = d.historique.map(h => `<div class="bubble ${h.qui}"><small>${h.qui === "me" ? esc(S.eleve.prenom) : esc(c.contact)}</small>${h.texte}</div>`).join("");
  return weekHead(1, "Ouverture et <span class='grad'>premier devis</span>", "Les ventes de la semaine sont tombées. Et un client professionnel veut une offre.") + coach("s1")
    + `<div class="grid g2" style="align-items:start"><div><h3 class="sub" style="margin-top:0">Les ventes de la semaine</h3>${ventesTable(1)}</div><div><h3 class="sub" style="margin-top:0">Mouvements en banque</h3>${ledger(1)}</div></div>
    <div class="card" style="margin-top:16px"><div class="client-card"><div class="cav">${c.avatar}</div><div><b>${esc(c.nom)}</b> · ${esc(c.contact)}, ${esc(c.role)}<br><span class="help" style="margin:0">« Bonjour ! Il me faudrait <b>${esc(qteTxt(qteClient(), a))}</b> ${esc(c.pourquoi)}, livraison dans deux semaines. Vous me faites un prix ? »</span></div></div>
      <div class="chat">${chat}</div>
      ${d.etat ? "" : `<h3 class="sub">Ton devis : ${qteClient()} × ${esc(a.nom)}</h3><p class="help" style="margin:0">Prix d'achat ${euro(pa(iStrat()))} HT · prix boutique ${euro(pvHT(iStrat()))} HT (${euro(pvTTC(iStrat()))} TTC). Un professionnel qui achète en quantité attend un prix inférieur au prix boutique.</p>
        <input type="range" class="pr" min="${devisMin()}" max="${devisMax()}" step="${pasDevis()}" value="${d.pu != null ? d.pu : puMarche()}" data-devis="pu" aria-label="Prix unitaire HT">
        <div class="dv-info">${devisInfo()}</div>
        <div style="margin-top:12px">${devisDoc()}</div><div class="nav" style="margin-top:12px"><span class="help">Tentative ${d.tentatives + 1} sur 2</span><button class="btn btn-main" data-act="devis">Envoyer le devis</button></div>`}
      ${devisAccepte() ? `<div class="note ok"><span class="i">✅</span><div><b>Commande acceptée : ${esc(qteTxt(qteClient(), a))} à ${euro(devisMontants().pu)} HT${d.remise ? `, remise ${d.remise}\u00a0%` : ""}, soit ${euro(devisHT())} HT.</b> Livraison en semaine 3, facture payable à ${DELAI_CLIENT} jours. Ces articles sont mis de côté dans ta réserve : la boutique ne les vendra pas.</div></div>
        ${besoin > 0 ? (d.complement ? `<div class="note gold"><span class="i">📦</span><div>Commande complémentaire passée chez ${esc(march().fournisseur.nom)} : ${esc(qteTxt(d.complement.qte, a))}, ${euro(d.complement.facture.totalTTC)} TTC à 30 jours. Livrée avant la semaine 2.</div></div>` : `<div class="note warn"><span class="i">⚠️</span><div><b>Stock insuffisant.</b> Après cette semaine, il te reste ${stockApres} ${esc(a.unite)}${stockApres > 1 ? "s" : ""} ; il t'en faut ${qteClient()} pour le client plus environ ${besoin - qteClient() + stockApres} pour la boutique. Commande complémentaire de <b>${besoin}</b> unités : ${euro(factureAchat([0,1,2].map(i => i === iStrat() ? besoin : 0), "compl").totalTTC)} TTC à 30 jours${besoin * pa(iStrat()) < COND.francoDes ? ", port compris" : ""}, livrée avant la semaine 2.</div></div><div class="nav" style="margin-top:0"><span></span><button class="btn btn-ghost" data-act="complement" data-qte="${besoin}">Commander ${besoin} unités en plus</button></div>`) : `<div class="help">Ton stock suffit pour livrer le client et tenir le mois : bien planifié.</div>`}` : d.etat === "refuse" ? `<div class="note bad"><span class="i">💔</span><div><b>Client perdu.</b> Ton prix dépassait son budget deux fois de suite : il commande ailleurs. Une grosse vente en moins ce mois-ci.</div></div>` : ""}</div>`
    + nav(!!d.etat && complementOK, d.etat ? "Passe la commande complémentaire pour pouvoir livrer." : "Envoie ton devis au client.", {label:"Clôturer la semaine 1"}); };

R.s2 = () => { const a = arts()[0], libre = SIM().libre0;                // V2 : l'échange demande un article libre en stock
  return weekHead(2, "Les <span class='grad'>échéances</span> tombent", "Loyer, assurances, factures de la mission 2 : la trésorerie encaisse le choc. Et un client revient mécontent.") + coach("s2")
    + `<div class="grid g2" style="align-items:start"><div><h3 class="sub" style="margin-top:0">Les ventes de la semaine</h3>${ventesTable(2)}${cashChart(2)}</div><div><h3 class="sub" style="margin-top:0">Mouvements en banque</h3>${ledger(2)}</div></div>
    <div class="card" style="margin-top:16px"><h3>😠 Un client revient avec un article défectueux : ${a.emoji} ${esc(a.cmd[0])}</h3><p class="help" style="margin:0 0 6px">Acheté ${euro(pvTTC(0))} la semaine dernière, inutilisable. Que fais-tu ?</p>
      <div class="decide">${[["rembourser","💶","Rembourser", `Tu rends ${euro(pvTTC(0))}. L'article part à la poubelle : la vente est annulée et le prix d'achat (${euro(pa(0))}) est perdu.`],["echanger","🔁","Échanger", libre ? `Tu donnes un article neuf : une unité sort du stock (${euro(pa(0))}), mais le client, ravi, parle de toi : +6\u00a0% de clients jusqu'à la fin du mois.` : `Impossible : il ne te reste aucun ${esc(a.unite)} libre en stock.`],["refuser","🚫","Refuser", "Tu ne perds rien aujourd'hui… mais le client est furieux et le dit partout : −12\u00a0% de clients jusqu'à la fin du mois."]].map(o => `<button class="choice ${S.retour === o[0] ? "on" : ""}" data-retour="${o[0]}" ${o[0] === "echanger" && !libre ? 'disabled style="opacity:.45;cursor:not-allowed"' : ""}><div class="ico">${o[1]}</div><h4>${o[2]}</h4><p>${o[3]}</p></button>`).join("")}</div>
      ${S.retour ? `<div class="note" style="margin:14px 0 0"><span class="i">🎓</span><div>En Belgique, la garantie légale oblige le vendeur à réparer, remplacer ou rembourser un bien défectueux : « refuser » coûte cher en réputation… et n'est pas légal. ${S.retour === "refuser" ? "Regarde l'effet sur les ventes des semaines 3 et 4." : S.retour === "echanger" ? "Le geste coûte le prix d'achat, pas le prix de vente : c'est souvent la meilleure option." : "Correct, mais tu perds la vente entière alors qu'un échange ne t'aurait coûté que le prix d'achat."}</div></div>` : ""}</div>`
    + nav(!!S.retour, "Décide pour le client mécontent.", {label:"Clôturer la semaine 2"}); };

R.s3 = () => { const b = SIM().b2b, v = S.vente, c = march().client, a = artClient();
  const exo = b ? (v.ok != null ? "" : `<div class="card" style="margin-top:14px"><h3>🧮 Rédige la facture de vente</h3><p class="help" style="margin:0 0 6px">${esc(qteTxt(b.q, a))} à ${euro(b.pu)} HT${b.remisePct ? `, remise ${b.remisePct}\u00a0% sur le montant brut` : ""}, TVA ${pctTVA()}\u00a0%. Calcule et saisis les trois montants (deux décimales, point ou virgule).</p>
      <div class="fact-form"><div><label>Total HT</label><input data-fv="ht" value="${esc(v.saisie.ht)}" placeholder="0,00" inputmode="decimal" class="${v.verif ? (v.verif.ht ? "ok" : "ko") : ""}"></div><div><label>TVA ${pctTVA()}\u00a0%</label><input data-fv="tva" value="${esc(v.saisie.tva)}" placeholder="0,00" inputmode="decimal" class="${v.verif ? (v.verif.tva ? "ok" : "ko") : ""}"></div><div><label>Total TTC</label><input data-fv="ttc" value="${esc(v.saisie.ttc)}" placeholder="0,00" inputmode="decimal" class="${v.verif ? (v.verif.ttc ? "ok" : "ko") : ""}"></div></div>
      ${v.vide ? `<div class="err">Remplis les trois montants avant de vérifier (un essai ne compte que s'il est complet).</div>` : v.verif && !v.ok ? `<div class="err">${v.essais >= 2 ? "Deuxième essai raté : la facture est complétée pour toi. Vérifie où était l'erreur." : `Au moins un montant est faux (en rouge). Encore un essai : montant brut = quantité × prix unitaire ; HT = brut − remise ; TVA = HT × ${pctTVA()}\u00a0% ; TTC = HT + TVA.`}</div>` : ""}
      <div class="nav" style="margin-top:10px"><span class="help">Essai ${v.essais + 1} sur 2 · +100 XP du premier coup</span><button class="btn btn-main" data-act="verifFact">Vérifier et émettre</button></div></div>`) : "";
  return weekHead(3, "Livraison et <span class='grad'>facture de vente</span>", b ? `Tu livres ${esc(qteTxt(b.q, a))} à ${esc(c.nom)} et tu rédiges ta première facture de vente. La banque prélève aussi ta mensualité.` : "Pas de commande à livrer cette semaine : le client est allé ailleurs. La banque prélève ta mensualité.") + coach("s3")
    + `<div class="grid g2" style="align-items:start"><div><h3 class="sub" style="margin-top:0">Les ventes de la semaine</h3>${ventesTable(3)}${cashChart(3)}</div><div><h3 class="sub" style="margin-top:0">Mouvements en banque</h3>${ledger(3)}</div></div>
    ${b ? `<div class="grid g2" style="margin-top:16px;align-items:start"><div>${blClientDoc()}</div>
      <div>${v.facture ? factureVenteDoc() : `${devisCopieDoc()}<p class="help">La facture de vente, c'est toi qui la rédiges : reprends le devis accepté et calcule les totaux dans le formulaire.</p>`}${b.partielle ? `<div class="note warn"><span class="i">⚠️</span><div>Livraison partielle : ${b.q} sur ${qteClient()}, faute de stock. Le client ne paie que ce qu'il a reçu.</div></div>` : ""}${v.facture ? `<div class="note gold" style="margin-top:12px"><span class="i">📌</span><div>Rien n'est encaissé aujourd'hui : une <b>créance client</b> de ${euro(b.ttc)} apparaît à l'actif. Tu as vendu, mais tu n'as pas encore l'argent.</div></div>` : ""}</div></div>${exo}` : ""}`
    + nav(!b || v.ok != null, "Rédige et vérifie la facture de vente.", {label:"Clôturer la semaine 3"}); };

R.s4 = () => { const sim = SIM(), hausse = Math.round((Math.pow(1 / (1 - PROMO.remise), elast()) * (MOTEUR.promoLieu[M1.emplacement] || 1) - 1) * 100), reste = sim.semaines[2].stock.reduce((s, q) => s + q, 0);
  return weekHead(4, "Dernière semaine et <span class='grad'>encaissement</span>", "Une promotion pour finir le mois en beauté ? Et le client professionnel règle sa facture.") + coach("s4")
    + `<div class="card" style="margin-bottom:16px"><h3>📣 Promotion de fin de mois sur toute la boutique ?</h3><p class="help" style="margin:0 0 6px">−15\u00a0% sur tous les prix affichés pendant la semaine 4 (${arts().map((a, i) => `${a.emoji} ${euro(pvTTC(i))} → ${euro(r2(pvTTC(i) * (1 - PROMO.remise)))}`).join(" · ")}). Chez toi, environ +${hausse}\u00a0% de clients : la promotion attire d'autant plus que ta clientèle est sensible au prix et que ton magasin est peu fréquenté. Il te reste ${reste} article${reste > 1 ? "s" : ""} en stock.${PRODUITS_FRAIS.includes(M1.typeId) ? ` Produits frais : ce qui reste en fin de mois s'abîme en partie (${Math.round(PERTE_FRAIS * 100)}\u00a0% jetés).` : ""}</p>
      <div class="grid g2"><button class="choice ${S.promo === true ? "on" : ""}" data-promo="1"><div class="ico">🔥</div><h4>Oui, je lance la promo</h4><p>Plus de clients, moins de marge par vente. Elle ne paie que s'il te reste assez de stock : sinon, tu brades sans vendre plus.</p></button><button class="choice ${S.promo === false ? "on" : ""}" data-promo="0"><div class="ico">🧘</div><h4>Non, je garde mes prix</h4><p>Marge intacte, volumes normaux. Le stock restant se vendra le mois prochain.</p></button></div></div>
    <div class="grid g2" style="align-items:start"><div><h3 class="sub" style="margin-top:0">Les ventes de la semaine${S.promo === null ? " (sans promo)" : ""}</h3>${ventesTable(4)}${cashChart(4)}</div><div><h3 class="sub" style="margin-top:0">Mouvements en banque</h3>${ledger(4)}</div></div>
    ${S.promo !== null ? `<div class="stat3" style="margin-top:14px"><div class="s"><span>Chiffre d'affaires du mois (HT)</span><b>${euro0(sim.ventesHT)}</b></div><div class="s"><span>Banque en fin de mois</span><b style="color:var(--mint)">${euro0(sim.banque)}</b></div><div class="s"><span>Stock restant</span><b>${sim.stock.reduce((s, q) => s + q, 0)} articles · ${euro0(stockValeur(sim.stock))}</b></div></div>` : ""}`
    + nav(S.promo !== null, "Décide pour la promotion.", {label:"Clôturer le mois"}); };

R.resultat = () => { const sim = SIM(), r = sim.resultatMois, varBanque = r2(sim.banque - M2.banque), ch = sim.charges;
  const l = (k, v, cls="") => `<div class="l ${cls}"><span>${k}</span><span>${v}</span></div>`;

function stepsStrip(){
  if (MODE !== "mission" || S.step > N3) return "";
  return `<div class="steps">${STEPS3.slice(1, N3 + 1).map((s, i) => { const n = i + 1, cls = S.step > n ? "done" : (S.step === n ? "now" : ""); return `<span class="stp ${cls}"><span class="n">${S.step > n ? "✓" : n}</span><span class="lab">${esc(s.label)}</span></span>`; }).join("")}</div><div class="steps-bar"><i style="width:${Math.round((S.step - 1) / N3 * 100)}%"></i></div>`;
}

const ERREURS = { email_invalide:"Cette adresse n'est pas valide (prenom.nom@istlm.org).", non_inscrit:"Cette adresse n'est pas sur la liste de ta classe.", reseau:"Impossible de joindre le serveur.", timeout:"Le serveur ne répond pas. Réessaie dans quelques secondes.", serveur:"Le serveur a refusé la demande. Préviens ton professeur." };
async function seConnecter(email){
  LOGIN.busy = true; LOGIN.err = ""; LOGIN.lent = false; render(); SESSION.email = email;
  const lent = setTimeout(() => { if (LOGIN.busy){ LOGIN.lent = true; render(); } }, 6000); let r;
  try { r = await connexion(); } catch(e) { clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false; LOGIN.err = ERREURS[e.message] || ERREURS.reseau; render(); return; }
  clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false;
  if (!r || !r.ok){ LOGIN.err = ERREURS[r && r.erreur] || "Connexion refusée."; render(); return; }
  appliquerConnexion(r, email);
}
function appliquerConnexion(r, email){
  SESSION.diag = r.diagnostic || null;
  const d = r.dossier, m1 = d && d.missions ? d.missions["1"] : null, m3 = d && d.missions ? d.missions["3"] : null;
  const id = Object.assign({email}, nomDepuisEmail(email), {classe:CONFIG.CLASSE_DEFAUT});
  [d && d.eleve, r.eleve].forEach(s => { if (s) ["prenom","nom","classe"].forEach(k => { if (s[k] && String(s[k]).trim()) id[k] = String(s[k]).trim(); }); });
  M1 = d ? normaliser(d) : null; M2 = d ? lireM2(d) : null;
  const bloquer = (why) => { S = fresh(); S.eleve = id; SESSION.bloque = why; MODE = "bloque"; render(true); };
  if (!M1 || !m1 || m1.statut !== "termine") return bloquer("m1");
  if (M1.ancien || !M1.apport || !M1.emplacement) return bloquer("ancien");
  if (!M2) return bloquer("m2");
  M1.eleve = { prenom:id.prenom, nom:id.nom, email };
  const serveur = m3 && m3.etatApp && m3.etatApp.v === 5 ? m3.etatApp : null, local = lireLocal(email);   // V2 : version 5 (nouveau moteur)
  if (r.statut === "termine" && serveur){ S = restaurer(serveur); MODE = "consultation"; S.step = N3 + 1; S.envoi = {mode:"ok"}; }
  else if (r.statut === "termine"){ S = restaurer(null); MODE = "ancien"; }
  else if (!r.ouvert){ S = restaurer(serveur || local); MODE = "ferme"; }
  else if (r.statut === "reinitialise"){ S = restaurer(null); S.briefing = true; MODE = "mission"; }
  else if (r.statut === "en_cours"){ const dernier = m3.dernier_envoi ? Date.parse(m3.dernier_envoi) : 0; S = restaurer(local && local.majLocale > dernier ? local : serveur); MODE = "mission"; }
  else { S = restaurer(local && local.step <= N3 ? local : null); MODE = "mission"; }
  S.eleve = id; if (!S.startedAt) S.startedAt = Date.now();
  if (MODE === "mission" && (S.step < 1 || S.step > N3)) S.step = 1;
  if (MODE === "mission" && !S.briefing) MODE = "briefing";
  save(); render(true);
}
async function verifierOuvert(){ try { const r = await jsonp({action:"ping", mission:CONFIG.MISSION}, 10000); if (r && r.diagnostic) SESSION.diag = r.diagnostic; return !!(r && r.acces && (r.missionsOuvertes || []).indexOf(CONFIG.MISSION) >= 0); } catch(e) { return true; } }
async function controlerEnFond(){ if (pingAutorise() && !(await verifierOuvert())){ annulerSauvegardePrevue(); if (MODE === "mission"){ MODE = "ferme"; save(); render(true); } } }
const VALID3 = { stock:() => S.qtes.every(q => q >= 1) && S.pub != null, reception:() => S.checks.every(Boolean) && S.signBL.trim().length >= 3, prix:() => S.prix.every(p => p != null),
  s1:() => !!S.devis.etat && (!devisAccepte() || !!S.devis.complement || besoinComplement() === 0),
  s2:() => !!S.retour && (S.retour !== "echanger" || SIM().echange), s3:() => !SIM().b2b || S.vente.ok != null, s4:() => S.promo !== null, resultat:() => true, bilan:() => bilanData(4).equilibre };
const MOTS_ETAPE = { stock:["grossiste","stock","franco","publicite"], reception:[], prix:["marge","coef","prixTTC","tauxMarque"], s1:["devis","ca"], s2:["chargesFixes"], s3:["factureVente","creance","tvaCollectee"], s4:["cogs"], resultat:["compteResultats","tresoVsResultat","perissable"], bilan:[] };
function suivant(){
  const st = STEPS3[S.step], key = st.key; if (!VALID3[key] || !VALID3[key]()) return;
  if (key === "stock" && !S.commande) S.commande = factureAchat(S.qtes, "stock");
  if (key === "reception"){ if (S.prix.some(p => p == null)) S.prix = [0,1,2].map(prixConseille); }      // V2 : les curseurs partent du prix conseillé (stratégie)
  if (key === "prix" && S.prix.every((p, i) => Math.abs(p - prixConseille(i)) < 0.01)) toast("<div>Tu gardes les prix conseillés pour ta stratégie : prudent. Tu pourras comparer avec tes camarades.</div>");
  if (key === "s1" && devisAccepte() && !S.devis.complement && besoinComplement() === 0) bonus("planificateur", 50);
  if (key === "s2" && S.retour !== "refuser") bonus("serviceClient", 50);           // V2 : accordé à la clôture de la semaine (plus quand on change d'avis)
  award(key, 100, st.badge); unlockMots(MOTS_ETAPE[key].filter(m => m !== "perissable" || PRODUITS_FRAIS.includes(M1.typeId)));
  S.step++; save(); render(true); sauvegarder(["stock","prix","s2","s4"].includes(key)); controlerEnFond();
}
function envoyerDevis(){
  const d = S.devis, max = puMaxClient(), q = qteClient(), a = artClient();
  if (d.pu == null) d.pu = puMarche();
  const m = devisMontants(), budget = r2(q * max);                         // V2 : le client compare le total HT de la vraie facture à son budget
